<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Japanese Lantern Sanctuary at Dusk — Pass 3</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --ink: #f0ece1;
      --ink-muted: rgba(240, 236, 225, 0.68);
      --ink-Subtle: rgba(240, 236, 225, 0.42);
      --rule: rgba(240, 236, 225, 0.22);
      --accent: #e89b54;
      --surface: rgba(15, 19, 29, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141a29;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 36px;
      z-index: 10;
      transition: opacity 0.2s ease;
    }

    body.chromeless #hud {
      display: none !important;
    }

    .hud-header {
      max-width: 460px;
      background: var(--surface);
      padding: 16px 20px;
      border-top: 2px solid var(--accent);
    }

    .hud-kicker {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 4px;
    }

    .hud-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 400;
      line-height: 1.25;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .hud-subtitle {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ink-muted);
    }

    .hud-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .camera-nav {
      pointer-events: auto;
      background: var(--surface);
      padding: 12px 18px;
      border-top: 1px solid var(--rule);
      display: flex;
      align-items: baseline;
      gap: 20px;
    }

    .camera-nav-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-Subtle);
    }

    .camera-nav-links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .camera-link {
      appearance: none;
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      padding: 2px 0;
      font-family: inherit;
      font-size: 13px;
      color: var(--ink-muted);
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .camera-link:hover {
      color: var(--ink);
      border-bottom-color: var(--ink-muted);
    }

    .camera-link.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
      font-weight: 500;
    }

    .controls-hint {
      background: var(--surface);
      padding: 10px 16px;
      border-top: 1px solid var(--rule);
      font-size: 12px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }
  </style>

  {

</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <header class="hud-header">
      <div class="hud-kicker">Architectural Sanctuary Study</div>
      <h1 class="hud-title">Floating Japanese Lantern Sanctuary at Dusk</h1>
      <p class="hud-subtitle">Water-bound timber torii, arched taikobashi footbridge, stone tōrō lanterns, and island haiden pavilion.</p>
    </header>

    <footer class="hud-footer">
      <nav class="camera-nav" aria-label="Camera Viewpoints">
        <span class="camera-nav-label">Viewpoint</span>
        <div class="camera-nav-links" id="camera-links"></div>
      </nav>
      <div class="controls-hint">
        Orbit: Left Drag &nbsp;|&nbsp; Pan: Right Drag &nbsp;|&nbsp; Fly: WASD + E/Q
      </div>
    </footer>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================================
    // 1. CANONICAL CAMERA PRESETS
    // ============================================================================
    const CAMERA_PRESETS = {
      overview: {
        position: [0, 7.5, 24],
        target: [0, 2.2, -2],
        fov: 45,
        label: 'Overview'
      },
      bridge: {
        position: [-5.5, 3.4, 11.5],
        target: [1.5, 2.4, -3.5],
        fov: 42,
        label: 'Arched bridge'
      },
      lantern_closeup: {
        position: [3.2, 1.85, 5.8],
        target: [1.8, 1.4, 2.2],
        fov: 38,
        label: 'Lantern close-up'
      },
      water_grazing: {
        position: [-2.8, 0.55, 8.5],
        target: [0.5, 1.6, -6.0],
        fov: 40,
        label: 'Water grazing'
      },
      sanctuary_interior: {
        position: [0.0, 2.8, -5.5],
        target: [0.0, 2.5, -16.5],
        fov: 46,
        label: 'Sanctuary interior'
      }
    };

    window.__CAMERA_PRESETS__ = CAMERA_PRESETS;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('chromeless') === '1') {
      document.body.classList.add('chromeless');
    }

    // ============================================================================
    // 2. SCENE, RENDERER, CAMERA & CONTROLS (AgX Tone Mapping + Twilight Fog)
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.AgXToneMapping;
    renderer.toneMappingExposure = 1.24;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x141b2e);
    scene.fog = new THREE.Fog(0x1b2138, 28, 116);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      260
    );

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxDistance = 85;
    controls.minDistance = 0.5;
    controls.maxPolarAngle = Math.PI * 0.495;

    // ============================================================================
    // 3. DETERMINISTIC NOISE, FBM & TANGENT-SPACE NORMAL MAP GENERATORS (PASS 2)
    // ============================================================================
    function seededRandom(seed) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return function () {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function hash2i(ix, iy, seed = 1) {
      let n = (ix * 374761393 + iy * 668265263 + seed * 1442695041) | 0;
      n = (n ^ (n >> 13)) | 0;
      n = Math.imul(n, 1274126177);
      return ((n ^ (n >> 16)) >>> 0) / 4294967295;
    }

    function hash3i(ix, iy, iz, seed = 1) {
      let n = (ix * 374761393 + iy * 668265263 + iz * 2147483647 + seed * 1442695041) | 0;
      n = (n ^ (n >> 13)) | 0;
      n = Math.imul(n, 1274126177);
      return ((n ^ (n >> 16)) >>> 0) / 4294967295;
    }

    function noise2D(x, y, seed = 1) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);

      const a = hash2i(ix, iy, seed);
      const b = hash2i(ix + 1, iy, seed);
      const c = hash2i(ix, iy + 1, seed);
      const d = hash2i(ix + 1, iy + 1, seed);

      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function noise3D(x, y, z, seed = 1) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const iz = Math.floor(z);
      const fx = x - ix;
      const fy = y - iy;
      const fz = z - iz;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);
      const uz = fz * fz * (3.0 - 2.0 * fz);

      const n000 = hash3i(ix, iy, iz, seed);
      const n100 = hash3i(ix + 1, iy, iz, seed);
      const n010 = hash3i(ix, iy + 1, iz, seed);
      const n110 = hash3i(ix + 1, iy + 1, iz, seed);
      const n001 = hash3i(ix, iy, iz + 1, seed);
      const n101 = hash3i(ix + 1, iy, iz + 1, seed);
      const n011 = hash3i(ix, iy + 1, iz + 1, seed);
      const n111 = hash3i(ix + 1, iy + 1, iz + 1, seed);

      const nx00 = n000 + (n100 - n000) * ux;
      const nx10 = n010 + (n110 - n010) * ux;
      const nx01 = n001 + (n101 - n001) * ux;
      const nx11 = n011 + (n111 - n011) * ux;

      const nxy0 = nx00 + (nx10 - nx00) * uy;
      const nxy1 = nx01 + (nx11 - nx01) * uy;

      return nxy0 + (nxy1 - nxy0) * uz;
    }

    function fbm2D(x, y, octaves = 4, seed = 1) {
      let val = 0.0;
      let amp = 0.5;
      let freq = 1.0;
      let norm = 0.0;
      for (let i = 0; i < octaves; i++) {
        val += amp * noise2D(x * freq, y * freq, seed + i * 19);
        norm += amp;
        freq *= 2.03;
        amp *= 0.5;
      }
      return val / norm;
    }

    function fbm3D(x, y, z, octaves = 4, seed = 1) {
      let val = 0.0;
      let amp = 0.5;
      let freq = 1.0;
      let norm = 0.0;
      for (let i = 0; i < octaves; i++) {
        val += amp * noise3D(x * freq, y * freq, z * freq, seed + i * 23);
        norm += amp;
        freq *= 2.02;
        amp *= 0.5;
      }
      return val / norm;
    }

    function heightFieldToNormalTexture(heightField, width, height, strength = 3.0) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;

      for (let y = 0; y < height; y++) {
        const ym1 = (y - 1 + height) % height;
        const yp1 = (y + 1) % height;
        for (let x = 0; x < width; x++) {
          const xm1 = (x - 1 + width) % width;
          const xp1 = (x + 1) % width;

          const hL = heightField[y * width + xm1];
          const hR = heightField[y * width + xp1];
          const hU = heightField[ym1 * width + x];
          const hD = heightField[yp1 * width + x];

          const dx = (hL - hR) * strength;
          const dy = (hU - hD) * strength;
          const dz = 1.0;
          const invLen = 1.0 / Math.hypot(dx, dy, dz);

          const idx = (y * width + x) * 4;
          data[idx] = Math.max(0, Math.min(255, Math.round((dx * invLen * 0.5 + 0.5) * 255)));
          data[idx + 1] = Math.max(0, Math.min(255, Math.round((dy * invLen * 0.5 + 0.5) * 255)));
          data[idx + 2] = Math.max(0, Math.min(255, Math.round((dz * invLen * 0.5 + 0.5) * 255)));
          data[idx + 3] = 255;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.NoColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    function scalarFieldToRoughnessTexture(roughField, width, height) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;

      for (let i = 0; i < width * height; i++) {
        const v = Math.max(0, Math.min(255, Math.round(roughField[i] * 255)));
        const idx = i * 4;
        data[idx] = v;
        data[idx + 1] = v;
        data[idx + 2] = v;
        data[idx + 3] = 255;
      }

      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.NoColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    // Helper to scale cylindrical/lathe UVs proportionally to physical size (eliminates horizontal stretching!)
    function scaleGeometryUVs(geo, uScale, vScale) {
      const uv = geo.attributes.uv;
      if (!uv) return geo;
      for (let i = 0; i < uv.count; i++) {
        uv.setXY(i, uv.getX(i) * uScale, uv.getY(i) * vScale);
      }
      uv.needsUpdate = true;
      return geo;
    }

    // ----------------------------------------------------------------------------
    // 3A. PASS 2 PROCEDURAL TEXTURE SET 1: WEATHERED CARVED GRANITE + MOSS (512x512)
    // ----------------------------------------------------------------------------
    function createGraniteTextureSet() {
      const W = 512;
      const H = 512;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = W;
      colorCanvas.height = H;
      const ctx = colorCanvas.getContext('2d');
      const imgData = ctx.createImageData(W, H);
      const cData = imgData.data;

      const heightField = new Float32Array(W * H);
      const roughField = new Float32Array(W * H);

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          const u = x / W;
          const v = y / H;
          const nx = Math.cos(u * Math.PI * 2) * 2.2 + Math.sin(u * Math.PI * 4) * 0.6;
          const ny = Math.cos(v * Math.PI * 2) * 2.2 + Math.sin(v * Math.PI * 4) * 0.6;

          const macro = fbm2D(nx * 1.6 + 4.1, ny * 1.6 + 2.3, 4, 11);
          const meso = fbm2D(x * 0.08, y * 0.08, 3, 29);
          const micro = hash2i(x, y, 47);
          const crystal = hash2i(Math.floor(x * 0.5), Math.floor(y * 0.5), 73);

          // Chisel pitting dimples
          const pitNoise = noise2D(x * 0.16, y * 0.16, 91);
          const chiselPit = pitNoise < 0.24 ? (0.24 - pitNoise) * 2.5 : 0.0;

          // Micro-crevice vein network
          const veinRaw = Math.abs(noise2D(x * 0.04 + macro * 1.8, y * 0.04 - macro * 1.8, 105) - 0.5);
          const crevice = veinRaw < 0.042 ? (0.042 - veinRaw) / 0.042 : 0.0;

          // Moss pockets in recessed pores
          const mossWave = fbm2D(nx * 1.3 + 8.5, ny * 1.3 - 3.7, 4, 137);
          const mossPatch = Math.max(0, Math.min(1, (mossWave - 0.55) * 3.0)) * (0.35 + 0.65 * chiselPit);

          const hVal = Math.max(
            0.0,
            Math.min(
              1.0,
              0.52 + macro * 0.22 + (meso - 0.5) * 0.24 + (crystal - 0.5) * 0.16 - chiselPit * 0.42 - crevice * 0.34
            )
          );
          heightField[i] = hVal;

          let r = 122 + (macro - 0.5) * 32 + (meso - 0.5) * 28;
          let g = 125 + (macro - 0.5) * 32 + (meso - 0.5) * 28;
          let b = 132 + (macro - 0.5) * 34 + (meso - 0.5) * 30;

          if (micro < 0.18) {
            r *= 0.60;
            g *= 0.61;
            b *= 0.64;
          } else if (micro > 0.84) {
            r += 26;
            g += 27;
            b += 30;
          }

          const pitDarken = 1.0 - chiselPit * 0.50 - crevice * 0.46;
          r *= pitDarken;
          g *= pitDarken;
          b *= pitDarken;

          if (mossPatch > 0.01) {
            const mr = 46 + micro * 16;
            const mg = 74 + micro * 20;
            const mb = 36 + micro * 10;
            r = r * (1.0 - mossPatch) + mr * mossPatch;
            g = g * (1.0 - mossPatch) + mg * mossPatch;
            b = b * (1.0 - mossPatch) + mb * mossPatch;
          }

          const idx = i * 4;
          cData[idx] = Math.max(0, Math.min(255, Math.round(r)));
          cData[idx + 1] = Math.max(0, Math.min(255, Math.round(g)));
          cData[idx + 2] = Math.max(0, Math.min(255, Math.round(b)));
          cData[idx + 3] = 255;

          roughField[i] = Math.max(
            0.44,
            Math.min(0.95, 0.80 - (micro > 0.84 ? 0.24 : 0.0) + chiselPit * 0.14 + mossPatch * 0.12)
          );
        }
      }

      ctx.putImageData(imgData, 0, 0);
      const colorMap = new THREE.CanvasTexture(colorCanvas);
      colorMap.wrapS = THREE.RepeatWrapping;
      colorMap.wrapT = THREE.RepeatWrapping;
      colorMap.colorSpace = THREE.SRGBColorSpace;
      colorMap.needsUpdate = true;

      const normalMap = heightFieldToNormalTexture(heightField, W, H, 4.5);
      const roughnessMap = scalarFieldToRoughnessTexture(roughField, W, H);

      return { colorMap, normalMap, roughnessMap };
    }

    // ----------------------------------------------------------------------------
    // 3B. PASS 2 PROCEDURAL TEXTURE SET 2: AGED VERMILION HINOKI TIMBER (512x512)
    // ----------------------------------------------------------------------------
    function createVermilionTimberTextureSet() {
      const W = 512;
      const H = 512;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = W;
      colorCanvas.height = H;
      const ctx = colorCanvas.getContext('2d');
      const imgData = ctx.createImageData(W, H);
      const cData = imgData.data;

      const heightField = new Float32Array(W * H);
      const roughField = new Float32Array(W * H);

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          const grainWave = fbm2D(x * 0.075, y * 0.009, 4, 211);
          const fineFiber = noise2D(x * 0.38, y * 0.045, 223);
          const ringCathedral = Math.sin((x * 0.045 + grainWave * 3.8) * Math.PI * 2) * 0.5 + 0.5;
          const weatherStreak = fbm2D(x * 0.032, y * 0.005, 3, 241);

          const hVal = 0.5 + (ringCathedral - 0.5) * 0.26 + (fineFiber - 0.5) * 0.22 + (grainWave - 0.5) * 0.14;
          heightField[i] = Math.max(0, Math.min(1, hVal));

          const lacquerWear = (weatherStreak - 0.45) * 0.35 + (1.0 - ringCathedral) * 0.15;
          const r = 192 - lacquerWear * 56 + (fineFiber - 0.5) * 14;
          const g = 54 - lacquerWear * 24 + (fineFiber - 0.5) * 8;
          const b = 36 - lacquerWear * 18 + (fineFiber - 0.5) * 6;

          const idx = i * 4;
          cData[idx] = Math.max(0, Math.min(255, Math.round(r)));
          cData[idx + 1] = Math.max(0, Math.min(255, Math.round(g)));
          cData[idx + 2] = Math.max(0, Math.min(255, Math.round(b)));
          cData[idx + 3] = 255;

          roughField[i] = Math.max(
            0.32,
            Math.min(0.55, 0.41 + lacquerWear * 0.22 + (0.5 - fineFiber) * 0.08)
          );
        }
      }

      ctx.putImageData(imgData, 0, 0);
      const colorMap = new THREE.CanvasTexture(colorCanvas);
      colorMap.wrapS = THREE.RepeatWrapping;
      colorMap.wrapT = THREE.RepeatWrapping;
      colorMap.colorSpace = THREE.SRGBColorSpace;
      colorMap.needsUpdate = true;

      const normalMap = heightFieldToNormalTexture(heightField, W, H, 2.6);
      const roughnessMap = scalarFieldToRoughnessTexture(roughField, W, H);

      return { colorMap, normalMap, roughnessMap };
    }

    // ----------------------------------------------------------------------------
    // 3C. PASS 2 PROCEDURAL TEXTURE SET 3: WEATHERED CEDAR BRIDGE PLANKS (512x512)
    // ----------------------------------------------------------------------------
    function createCedarPlankTextureSet() {
      const W = 512;
      const H = 512;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = W;
      colorCanvas.height = H;
      const ctx = colorCanvas.getContext('2d');
      const imgData = ctx.createImageData(W, H);
      const cData = imgData.data;

      const heightField = new Float32Array(W * H);
      const roughField = new Float32Array(W * H);

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          const grainWarp = fbm2D(x * 0.012, y * 0.08, 4, 307);
          const ringPattern = Math.sin((y * 0.06 + grainWarp * 4.2) * Math.PI * 2) * 0.5 + 0.5;
          const fineGrain = noise2D(x * 0.06, y * 0.42, 317);
          const patina = fbm2D(x * 0.02, y * 0.02, 3, 331);

          const seamDist = Math.min(y % 128, 128 - (y % 128));
          const seamGroove = seamDist < 4 ? (4 - seamDist) / 4.0 : 0.0;

          const hVal =
            0.55 +
            (ringPattern - 0.5) * 0.25 +
            (fineGrain - 0.5) * 0.20 -
            seamGroove * 0.48;
          heightField[i] = Math.max(0, Math.min(1, hVal));

          const shade = (1.0 - seamGroove * 0.65) * (0.86 + ringPattern * 0.22 + (fineGrain - 0.5) * 0.12);
          const r = (132 + (patina - 0.5) * 24) * shade;
          const g = (79 + (patina - 0.5) * 16) * shade;
          const b = (53 + (patina - 0.5) * 14) * shade;

          const idx = i * 4;
          cData[idx] = Math.max(0, Math.min(255, Math.round(r)));
          cData[idx + 1] = Math.max(0, Math.min(255, Math.round(g)));
          cData[idx + 2] = Math.max(0, Math.min(255, Math.round(b)));
          cData[idx + 3] = 255;

          roughField[i] = Math.max(
            0.46,
            Math.min(0.86, 0.62 + (0.5 - ringPattern) * 0.16 + seamGroove * 0.22)
          );
        }
      }

      ctx.putImageData(imgData, 0, 0);
      const colorMap = new THREE.CanvasTexture(colorCanvas);
      colorMap.wrapS = THREE.RepeatWrapping;
      colorMap.wrapT = THREE.RepeatWrapping;
      colorMap.colorSpace = THREE.SRGBColorSpace;
      colorMap.needsUpdate = true;

      const normalMap = heightFieldToNormalTexture(heightField, W, H, 3.4);
      const roughnessMap = scalarFieldToRoughnessTexture(roughField, W, H);

      return { colorMap, normalMap, roughnessMap };
    }

    // ----------------------------------------------------------------------------
    // 3D. PASS 2 PROCEDURAL TEXTURE SET 4: RIBBED HON-KAWARA ROOF TILES (512x512)
    // ----------------------------------------------------------------------------
    function createKawaraTileTextureSet() {
      const W = 512;
      const H = 512;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = W;
      colorCanvas.height = H;
      const ctx = colorCanvas.getContext('2d');
      const imgData = ctx.createImageData(W, H);
      const cData = imgData.data;

      const heightField = new Float32Array(W * H);
      const roughField = new Float32Array(W * H);

      const colW = 32;
      const rowH = 32;

      for (let y = 0; y < H; y++) {
        const courseV = (y % rowH) / rowH;
        const courseStep = courseV < 0.16 ? courseV / 0.16 : 1.0 - (courseV - 0.16) * 0.25;
        const courseShadow = courseV < 0.15 ? 0.36 + (courseV / 0.15) * 0.64 : 1.0;

        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          const colU = (x % colW) / colW;

          let tileArch = 0.0;
          let isRidgeTile = false;
          if (colU < 0.64) {
            const panNorm = (colU / 0.64) * 2.0 - 1.0;
            tileArch = 0.20 + panNorm * panNorm * 0.24;
          } else {
            isRidgeTile = true;
            const ridgeNorm = ((colU - 0.64) / 0.36) * 2.0 - 1.0;
            tileArch = 0.54 + Math.sqrt(Math.max(0, 1.0 - ridgeNorm * ridgeNorm)) * 0.46;
          }

          const weather = fbm2D(x * 0.025, y * 0.025, 3, 409);
          const ceramicGrain = noise2D(x * 0.22, y * 0.22, 419);

          const hVal = Math.max(0, Math.min(1, tileArch * 0.78 + courseStep * 0.20 + (ceramicGrain - 0.5) * 0.04));
          heightField[i] = hVal;

          // Smoked silver-slate ibushi-kawara ceramic palette with crisp ridge-to-pan contrast
          const ridgeHighlight = isRidgeTile ? 1.28 : 0.86;
          const shade = courseShadow * ridgeHighlight * (0.85 + tileArch * 0.30 + (weather - 0.5) * 0.14);

          let r = 52 * shade;
          let g = 61 * shade;
          let b = 78 * shade;

          if (courseV < 0.18 && weather > 0.60) {
            const mAmt = (weather - 0.60) * 1.4;
            r = r * (1.0 - mAmt) + 52 * mAmt;
            g = g * (1.0 - mAmt) + 76 * mAmt;
            b = b * (1.0 - mAmt) + 42 * mAmt;
          }

          const idx = i * 4;
          cData[idx] = Math.max(0, Math.min(255, Math.round(r)));
          cData[idx + 1] = Math.max(0, Math.min(255, Math.round(g)));
          cData[idx + 2] = Math.max(0, Math.min(255, Math.round(b)));
          cData[idx + 3] = 255;

          roughField[i] = Math.max(
            0.38,
            Math.min(0.88, (isRidgeTile ? 0.42 : 0.58) + (1.0 - courseShadow) * 0.26 + (weather - 0.5) * 0.12)
          );
        }
      }

      ctx.putImageData(imgData, 0, 0);
      const colorMap = new THREE.CanvasTexture(colorCanvas);
      colorMap.wrapS = THREE.RepeatWrapping;
      colorMap.wrapT = THREE.RepeatWrapping;
      colorMap.colorSpace = THREE.SRGBColorSpace;
      colorMap.needsUpdate = true;

      const normalMap = heightFieldToNormalTexture(heightField, W, H, 5.2);
      const roughnessMap = scalarFieldToRoughnessTexture(roughField, W, H);

      return { colorMap, normalMap, roughnessMap };
    }

    // ============================================================================
    // 3F. PASS 2 WET-STONE SHORELINE (y < 0.38) & UPWARD-NORMAL VELVET MOSS SHADER
    // ============================================================================
    function applyWetMossShorelineShader(material, options = {}) {
      const {
        waterlineY = 0.38,
        wetDarken = 0.55, // 45% albedo darkening near waterline (y < 0.38)
        wetRoughness = 0.17, // 0.15-0.22 glistening wet stone roughness
        dryRoughness = 0.82, // 0.82 weathered granite roughness above y = 0.38
        mossStrength = 0.92,
        mossSlopeThreshold = 0.42
      } = options;

      material.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
            varying vec3 vShoreWorldPos;
            varying vec3 vShoreWorldNormal;`
          )
          .replace(
            '#include <beginnormal_vertex>',
            `#include <beginnormal_vertex>
            vShoreWorldNormal = normalize(mat3(modelMatrix) * objectNormal);`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            vShoreWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
            varying vec3 vShoreWorldPos;
            varying vec3 vShoreWorldNormal;`
          )
          .replace(
            '#include <color_fragment>',
            `#include <color_fragment>
            float shoreNoise = 0.032 * sin(vShoreWorldPos.x * 4.3 + vShoreWorldPos.z * 3.9)
                             + 0.018 * cos(vShoreWorldPos.x * 11.2 - vShoreWorldPos.z * 9.7);
            float effectiveWaterline = ${waterlineY.toFixed(3)} + shoreNoise;
            float wetFactor = 1.0 - smoothstep(effectiveWaterline - 0.10, effectiveWaterline + 0.04, vShoreWorldPos.y);
            float meniscusFactor = 1.0 - smoothstep(0.0, 0.10, vShoreWorldPos.y);

            // Patchy velvet moss (#2b4222 / #3b5628) on upward-facing normals above y = 0.38
            float mossMacro = 0.5 + 0.5 * sin(vShoreWorldPos.x * 2.1 + cos(vShoreWorldPos.z * 2.3) * 1.6)
                                        * cos(vShoreWorldPos.z * 1.9 - sin(vShoreWorldPos.x * 1.7) * 1.4);
            float mossMicro = 0.5 + 0.5 * sin(vShoreWorldPos.x * 17.5 + vShoreWorldPos.z * 19.3);
            float upAlign = clamp(vShoreWorldNormal.y, 0.0, 1.0);
            float mossMask = (1.0 - wetFactor) * ${mossStrength.toFixed(3)}
                           * smoothstep(${mossSlopeThreshold.toFixed(3)}, 0.74, upAlign + (mossMacro - 0.44) * 0.36);

            vec3 velvetMossDark = vec3(0.024, 0.054, 0.016);
            vec3 velvetMossLight = vec3(0.043, 0.091, 0.022);
            vec3 velvetMossCol = mix(velvetMossDark, velvetMossLight, mossMacro * 0.65 + mossMicro * 0.35);

            diffuseColor.rgb = mix(diffuseColor.rgb, velvetMossCol, clamp(mossMask, 0.0, 1.0));
            diffuseColor.rgb *= mix(1.0, ${wetDarken.toFixed(3)}, wetFactor);
            diffuseColor.rgb *= mix(1.0, 0.74, meniscusFactor);`
          )
          .replace(
            '#include <roughnessmap_fragment>',
            `#include <roughnessmap_fragment>
            float rShoreNoise = 0.032 * sin(vShoreWorldPos.x * 4.3 + vShoreWorldPos.z * 3.9)
                              + 0.018 * cos(vShoreWorldPos.x * 11.2 - vShoreWorldPos.z * 9.7);
            float rWaterline = ${waterlineY.toFixed(3)} + rShoreNoise;
            float rWetFactor = 1.0 - smoothstep(rWaterline - 0.10, rWaterline + 0.04, vShoreWorldPos.y);
            float rMossMacro = 0.5 + 0.5 * sin(vShoreWorldPos.x * 2.1 + cos(vShoreWorldPos.z * 2.3) * 1.6);
            float rUpAlign = clamp(vShoreWorldNormal.y, 0.0, 1.0);
            float rMossMask = (1.0 - rWetFactor) * ${mossStrength.toFixed(3)}
                            * smoothstep(${mossSlopeThreshold.toFixed(3)}, 0.74, rUpAlign + (rMossMacro - 0.44) * 0.36);
            float targetDryRough = mix(${dryRoughness.toFixed(3)}, 0.90, clamp(rMossMask, 0.0, 1.0)) * (0.85 + 0.30 * roughnessFactor);
            float targetWetRough = ${wetRoughness.toFixed(3)} + 0.04 * (1.0 - rWetFactor);
            roughnessFactor = clamp(mix(targetDryRough, targetWetRough, rWetFactor), 0.15, 0.94);`
          );
      };
      material.needsUpdate = true;
      return material;
    }

    // ============================================================================
    // 3G. PASS 3 JAPANESE MAPLE (IROHA-MOMIJI) PALMATE LEAF BOUGH TEXTURE SET (512x512)
    // ============================================================================
    function drawPalmateMapleLeaf(ctx, cx, cy, radius, rotation, palette, rng, isShadow = false) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      // 7-lobed Japanese maple (Acer palmatum / iroha-momiji) geometry
      const lobeAngles = [-1.92, -1.26, -0.60, 0.0, 0.60, 1.26, 1.92];
      const lobeLengths = [0.46, 0.76, 0.95, 1.04, 0.95, 0.76, 0.46];
      const sinusDepths = [0.26, 0.32, 0.36, 0.36, 0.32, 0.26];

      if (!isShadow) {
        // Slender petiole stem
        ctx.strokeStyle = 'rgba(72, 24, 16, 0.92)';
        ctx.lineWidth = Math.max(1.2, radius * 0.045);
        ctx.beginPath();
        ctx.moveTo(0, radius * 0.14);
        ctx.quadraticCurveTo(radius * 0.03, radius * 0.34, 0, radius * 0.02);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.moveTo(0, radius * 0.08);

      for (let l = 0; l < 7; l++) {
        const ang = lobeAngles[l] - Math.PI * 0.5;
        const len = lobeLengths[l] * radius;
        const halfSpread = 0.22;

        // Left serrated edge of lobe l with 3 saw-teeth
        const steps = 4;
        for (let s = 1; s <= steps; s++) {
          const t = s / steps;
          const baseR = radius * 0.28 + (len - radius * 0.28) * Math.pow(t, 0.82);
          const serration = s < steps ? (s % 2 === 1 ? radius * 0.045 : -radius * 0.02) : 0;
          const a = ang - halfSpread * (1.0 - t * 0.88);
          const px = Math.cos(a) * (baseR + serration);
          const py = Math.sin(a) * (baseR + serration);
          ctx.lineTo(px, py);
        }

        // Right serrated edge of lobe l descending into sinus
        for (let s = steps - 1; s >= 1; s--) {
          const t = s / steps;
          const baseR = radius * 0.28 + (len - radius * 0.28) * Math.pow(t, 0.82);
          const serration = s % 2 === 1 ? radius * 0.045 : -radius * 0.02;
          const a = ang + halfSpread * (1.0 - t * 0.88);
          const px = Math.cos(a) * (baseR + serration);
          const py = Math.sin(a) * (baseR + serration);
          ctx.lineTo(px, py);
        }

        if (l < 6) {
          const sinusAng = (lobeAngles[l] + lobeAngles[l + 1]) * 0.5 - Math.PI * 0.5;
          const sR = sinusDepths[l] * radius;
          ctx.lineTo(Math.cos(sinusAng) * sR, Math.sin(sinusAng) * sR);
        }
      }

      ctx.closePath();

      if (isShadow) {
        ctx.fillStyle = 'rgba(18, 4, 4, 0.36)';
        ctx.fill();
        ctx.restore();
        return;
      }

      const grad = ctx.createRadialGradient(0, -radius * 0.15, radius * 0.08, 0, -radius * 0.32, radius * 1.05);
      grad.addColorStop(0.0, palette.base);
      grad.addColorStop(0.55, palette.mid);
      grad.addColorStop(1.0, palette.tip);
      ctx.fillStyle = grad;
      ctx.fill();

      // Delicate dark crimson margin outline for crisp palmate lobe readability
      ctx.strokeStyle = 'rgba(56, 10, 8, 0.52)';
      ctx.lineWidth = Math.max(0.9, radius * 0.028);
      ctx.stroke();

      // 7 radiating primary leaf veins
      ctx.strokeStyle = palette.vein;
      ctx.lineWidth = Math.max(0.8, radius * 0.026);
      for (let l = 0; l < 7; l++) {
        const ang = lobeAngles[l] - Math.PI * 0.5;
        const vLen = lobeLengths[l] * radius * 0.86;
        ctx.beginPath();
        ctx.moveTo(0, radius * 0.03);
        ctx.lineTo(Math.cos(ang) * vLen, Math.sin(ang) * vLen);
        ctx.stroke();
      }

      ctx.restore();
    }

    function createMapleLeafBoughTextureSet() {
      const W = 512;
      const H = 512;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = W;
      colorCanvas.height = H;
      const ctx = colorCanvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const rng = seededRandom(808);

      // 1. Delicate woody branchlets radiating from the bough center/base
      ctx.lineCap = 'round';
      const twigAngles = [-2.4, -1.75, -1.15, -0.55, 0.05, 0.65, 1.25, 1.85, 2.45];
      twigAngles.forEach((ta) => {
        const len = 145 + rng() * 55;
        const midX = 256 + Math.cos(ta) * (len * 0.52) + (rng() - 0.5) * 18;
        const midY = 264 + Math.sin(ta) * (len * 0.52) + (rng() - 0.5) * 18;
        const endX = 256 + Math.cos(ta) * len;
        const endY = 264 + Math.sin(ta) * len;

        ctx.strokeStyle = '#34221a';
        ctx.lineWidth = 4.2;
        ctx.beginPath();
        ctx.moveTo(256, 264);
        ctx.quadraticCurveTo(midX, midY, endX, endY);
        ctx.stroke();

        // Sub-twigs
        [-0.42, 0.42].forEach((subOff) => {
          const sa = ta + subOff;
          const sLen = 58 + rng() * 28;
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(midX, midY);
          ctx.lineTo(midX + Math.cos(sa) * sLen, midY + Math.sin(sa) * sLen);
          ctx.stroke();
        });
      });

      const leafPalettes = [
        { base: '#8c2216', mid: '#ba341a', tip: '#d9521e', vein: 'rgba(68, 16, 10, 0.55)' },
        { base: '#9e2818', mid: '#cc421c', tip: '#e66822', vein: 'rgba(78, 20, 12, 0.52)' },
        { base: '#ad321a', mid: '#d95620', tip: '#f08226', vein: 'rgba(88, 24, 12, 0.50)' },
        { base: '#781b14', mid: '#a62a18', tip: '#c9441c', vein: 'rgba(58, 14, 9, 0.58)' },
        { base: '#ba3e1c', mid: '#e06a22', tip: '#f59c2a', vein: 'rgba(95, 28, 12, 0.48)' }
      ];

      // 2. Arrange 44 overlapping 7-lobed palmate leaves in a porous, organic bough spray
      const leaves = [];
      // Outer ring of leaves (leaves porous gaps for sky/light filtering)
      const outerCount = 20;
      for (let i = 0; i < outerCount; i++) {
        const a = (i / outerCount) * Math.PI * 2 + (rng() - 0.5) * 0.18;
        const dist = 128 + rng() * 58;
        leaves.push({
          x: 256 + Math.cos(a) * dist,
          y: 256 + Math.sin(a) * dist,
          r: 52 + rng() * 22,
          rot: a + Math.PI * 0.5 + (rng() - 0.5) * 0.65,
          pal: leafPalettes[Math.floor(rng() * leafPalettes.length)]
        });
      }
      // Mid ring of leaves
      const midCount = 15;
      for (let i = 0; i < midCount; i++) {
        const a = (i / midCount) * Math.PI * 2 + 0.16 + (rng() - 0.5) * 0.22;
        const dist = 68 + rng() * 52;
        leaves.push({
          x: 256 + Math.cos(a) * dist,
          y: 256 + Math.sin(a) * dist,
          r: 56 + rng() * 20,
          rot: a + Math.PI * 0.5 + (rng() - 0.5) * 0.75,
          pal: leafPalettes[Math.floor(rng() * leafPalettes.length)]
        });
      }
      // Crown center leaves
      const innerCount = 9;
      for (let i = 0; i < innerCount; i++) {
        const a = (i / innerCount) * Math.PI * 2 + (rng() - 0.5) * 0.3;
        const dist = 16 + rng() * 38;
        leaves.push({
          x: 256 + Math.cos(a) * dist,
          y: 256 + Math.sin(a) * dist,
          r: 54 + rng() * 18,
          rot: a + Math.PI * 0.5 + (rng() - 0.5) * 0.9,
          pal: leafPalettes[Math.floor(rng() * leafPalettes.length)]
        });
      }

      leaves.forEach((lf) => {
        drawPalmateMapleLeaf(ctx, lf.x + 4, lf.y + 5, lf.r, lf.rot, lf.pal, rng, true);
        drawPalmateMapleLeaf(ctx, lf.x, lf.y, lf.r, lf.rot, lf.pal, rng, false);
      });

      const imgData = ctx.getImageData(0, 0, W, H);
      const cData = imgData.data;
      const heightField = new Float32Array(W * H);
      const roughField = new Float32Array(W * H);

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          const idx = i * 4;
          const a = cData[idx + 3] / 255.0;
          const lum = (cData[idx] * 0.35 + cData[idx + 1] * 0.45 + cData[idx + 2] * 0.20) / 255.0;
          const microCell = noise2D(x * 0.25, y * 0.25, 821);
          heightField[i] = a > 0.1 ? Math.max(0, Math.min(1, 0.35 + lum * 0.52 + (microCell - 0.5) * 0.14)) : 0.0;
          roughField[i] = Math.max(0.62, Math.min(0.90, 0.78 - lum * 0.08 + (microCell - 0.5) * 0.08));
        }
      }

      const colorMap = new THREE.CanvasTexture(colorCanvas);
      colorMap.colorSpace = THREE.SRGBColorSpace;
      colorMap.needsUpdate = true;

      const normalMap = heightFieldToNormalTexture(heightField, W, H, 1.8);
      const roughnessMap = scalarFieldToRoughnessTexture(roughField, W, H);

      return { colorMap, normalMap, roughnessMap };
    }

    function applyMapleFoliageShader(material) {
      material.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
            varying vec3 vLeafWorldPos;
            varying vec3 vLeafWorldNormal;`
          )
          .replace(
            '#include <beginnormal_vertex>',
            `#include <beginnormal_vertex>
            vLeafWorldNormal = normalize(mat3(modelMatrix) * objectNormal);`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            vLeafWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
            varying vec3 vLeafWorldPos;
            varying vec3 vLeafWorldNormal;`
          )
          .replace(
            '#include <lights_fragment_end>',
            `#include <lights_fragment_end>
            // 1. Suppress dielectric sky/fill specular glare so leaves never wash out to pink under AgX
            reflectedLight.directSpecular *= 0.03;
            reflectedLight.indirectSpecular *= 0.02;

            // 2. Attenuate ambient twilight fill & warm-shift diffuse so leaves stay in AgX's rich saturated crimson/vermilion/amber range
            reflectedLight.directDiffuse *= vec3(0.62, 0.52, 0.28);
            reflectedLight.indirectDiffuse *= vec3(0.38, 0.32, 0.18);

            // 3. Controlled Backlit Subsurface Scattering (SSS) + Warm Lantern Under-Canopy Translucency
            vec3 leafV = normalize(cameraPosition - vLeafWorldPos);
            vec3 leafN = normalize(vLeafWorldNormal) * (gl_FrontFacing ? 1.0 : -1.0);
            vec3 duskDir = normalize(vec3(-24.0, 15.0, -32.0));

            float backSun = pow(clamp(dot(leafV, -duskDir) * 0.55 + 0.45, 0.0, 1.0), 2.2);
            float rimView = pow(1.0 - abs(dot(leafN, leafV)), 2.0);
            float crownHeight = clamp((vLeafWorldPos.y - 1.2) / 3.4, 0.0, 1.0);
            vec3 sssWarm = diffuseColor.rgb * vec3(0.36, 0.22, 0.04) * (0.25 + 0.50 * backSun + 0.25 * rimView) * crownHeight;

            float sanctGlow = exp(-length(vLeafWorldPos.xz - vec2(0.0, -14.5)) * 0.18);
            float toriiGlow = exp(-length(vLeafWorldPos.xz - vec2(0.0, -2.0)) * 0.20);
            float bridgeLanternGlow = exp(-length(vLeafWorldPos.xz - vec2(-4.4, 13.0)) * 0.24)
                                    + exp(-length(vLeafWorldPos.xz - vec2(6.2, 8.8)) * 0.26);
            float underFace = clamp(-leafN.y * 0.5 + 0.5, 0.20, 1.0);
            vec3 lanternTranslucency = diffuseColor.rgb * vec3(0.42, 0.25, 0.05) * (sanctGlow * 0.55 + toriiGlow * 0.45 + bridgeLanternGlow * 0.40) * underFace;

            reflectedLight.indirectDiffuse += sssWarm + lanternTranslucency;`
          );
      };
      material.needsUpdate = true;
      return material;
    }

    function buildSkyDomeGeometry(radius, widthSegs, heightSegs, forPMREM = false) {
      const skyGeo = new THREE.SphereGeometry(radius, widthSegs, heightSegs);
      const posAttr = skyGeo.attributes.position;
      const colors = [];

      const zenithColor = new THREE.Color(0x0a0f1f);
      const upperMidColor = new THREE.Color(0x182342);
      const lowerMidColor = new THREE.Color(0x3f2e54);
      const duskBandColor = new THREE.Color(0x8c484e);
      const horizonColor = new THREE.Color(0xd97845);
      const sunGlowColor = new THREE.Color(0xf49b56);
      const mountainSilhouetteCol = new THREE.Color(0x161d34);
      const abyssalWaterCol = new THREE.Color(0x090f1d);
      const c = new THREE.Color();

      for (let i = 0; i < posAttr.count; i++) {
        const vx = posAttr.getX(i);
        const vy = posAttr.getY(i);
        const vz = posAttr.getZ(i);
        const rawY = vy / radius;

        if (forPMREM && rawY < 0.0) {
          c.copy(abyssalWaterCol);
          colors.push(c.r, c.g, c.b);
          continue;
        }

        const yNorm = forPMREM ? Math.max(0, rawY) : Math.abs(rawY);

        if (yNorm < 0.07) {
          c.lerpColors(horizonColor, duskBandColor, yNorm / 0.07);
        } else if (yNorm < 0.19) {
          c.lerpColors(duskBandColor, lowerMidColor, (yNorm - 0.07) / 0.12);
        } else if (yNorm < 0.46) {
          c.lerpColors(lowerMidColor, upperMidColor, (yNorm - 0.19) / 0.27);
        } else {
          c.lerpColors(upperMidColor, zenithColor, Math.min(1, (yNorm - 0.46) / 0.54));
        }

        const horizLen = Math.hypot(vx, vz) || 1;
        const nx = vx / horizLen;
        const nz = vz / horizLen;
        const sunAlign = Math.max(0, (-nz * 0.88 - nx * 0.47));
        const horizonFactor = Math.pow(Math.max(0, 1.0 - yNorm * 3.2), 1.8);
        const afterglow = Math.pow(sunAlign, 2.2) * horizonFactor * (forPMREM ? 0.08 : 0.48);
        if (afterglow > 0.001) {
          c.lerp(sunGlowColor, afterglow);
        }

        if (forPMREM && yNorm < 0.38) {
          const occ = 1.0 - Math.min(1.0, Math.max(0.0, (yNorm - 0.22) / 0.16));
          c.lerp(mountainSilhouetteCol, occ * 0.95);
        }

        colors.push(c.r, c.g, c.b);
      }

      skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      return skyGeo;
    }

    function createMountainRidgeLayer(config) {
      const {
        radius,
        arcAngle,
        centerAngle,
        widthSegs,
        heightSegs,
        baseHeight,
        amp,
        seed,
        peakColorHex,
        midColorHex,
        hazeColorHex
      } = config;

      const geo = new THREE.BufferGeometry();
      const positions = [];
      const colors = [];
      const indices = [];

      const peakCol = new THREE.Color(peakColorHex);
      const midCol = new THREE.Color(midColorHex);
      const hazeCol = new THREE.Color(hazeColorHex);
      const tmpCol = new THREE.Color();

      for (let ix = 0; ix <= widthSegs; ix++) {
        const u = ix / widthSegs;
        const theta = centerAngle + (u - 0.5) * arcAngle;

        const edgeEnvelope = Math.sin(u * Math.PI);
        const edgeSmooth = Math.pow(edgeEnvelope, 0.40);

        const a1 = theta * 3.0 + seed * 1.7;
        const a2 = theta * 7.0 - seed * 2.3;
        const a3 = theta * 15.0 + seed * 4.1;
        const a4 = theta * 29.0 - seed * 6.7;

        const r1 = 1.0 - Math.abs(Math.sin(a1));
        const r2 = 1.0 - Math.abs(Math.sin(a2));
        const r3 = 1.0 - Math.abs(Math.cos(a3));
        const r4 = Math.sin(a4) * 0.5 + 0.5;

        const centerAxisDist = Math.abs(theta - (-Math.PI * 0.5));
        const shrineValleyMod = 0.78 + 0.22 * Math.min(1.0, centerAxisDist / 0.32);

        const ridgeElev =
          (baseHeight +
            amp * (r1 * 0.52 + r2 * 0.28 + r3 * 0.14 + r4 * 0.06)) *
          edgeSmooth *
          shrineValleyMod;

        for (let iy = 0; iy <= heightSegs; iy++) {
          const v = iy / heightSegs;
          const radialOffset = radius - (1.0 - v) * 9.5 + Math.sin(theta * 9.0 + v * 2.0) * 1.4;
          const x = Math.cos(theta) * radialOffset;
          const z = Math.sin(theta) * radialOffset;
          const y = v * ridgeElev;

          positions.push(x, y, z);

          const hNorm = Math.max(0, Math.min(1, y / (baseHeight + amp)));
          if (hNorm < 0.35) {
            tmpCol.lerpColors(hazeCol, midCol, hNorm / 0.35);
          } else {
            tmpCol.lerpColors(midCol, peakCol, (hNorm - 0.35) / 0.65);
          }
          colors.push(tmpCol.r, tmpCol.g, tmpCol.b);
        }
      }

      const stride = heightSegs + 1;
      for (let ix = 0; ix < widthSegs; ix++) {
        for (let iy = 0; iy < heightSegs; iy++) {
          const a = ix * stride + iy;
          const b = (ix + 1) * stride + iy;
          const c = (ix + 1) * stride + (iy + 1);
          const d = ix * stride + (iy + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      geo.setIndex(indices);
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.94,
        metalness: 0.02,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
      return mesh;
    }

    // Planar Reflection RenderTarget, Mirror Camera & Water Uniforms (Pass 3)
    const reflectionRT = new THREE.WebGLRenderTarget(1440, 900, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType
    });
    const mirrorCamera = camera.clone();
    let waterMesh = null;
    let skyDomeMesh = null;

    const waterUniforms = {
      uReflectionMap: { value: reflectionRT.texture },
      uTime: { value: 0.0 },
      uLanternPositions: {
        value: Array.from({ length: 17 }, () => new THREE.Vector3())
      }
    };

    function createEnvironment() {
      // 1. Multi-stop twilight sky dome
      const skyGeo = buildSkyDomeGeometry(148, 64, 44, false);
      const skyMat = new THREE.MeshBasicMaterial({
        vertexColors: true,
        side: THREE.BackSide,
        fog: false
      });
      const skyMesh = new THREE.Mesh(skyGeo, skyMat);
      skyDomeMesh = skyMesh;
      scene.add(skyMesh);

      // 2. Generate PMREM twilight environment map with mountain horizon occlusion
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      const envSkyMesh = new THREE.Mesh(
        buildSkyDomeGeometry(60, 48, 32, true),
        new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })
      );
      envScene.add(envSkyMesh);
      const envMapRT = pmremGenerator.fromScene(envScene, 0.035);
      scene.environment = envMapRT.texture;
      scene.environmentIntensity = 0.84;
      pmremGenerator.dispose();

      // 3. Pinpoint twilight stars in the upper sky dome
      const starRng = seededRandom(707);
      const starCount = 320;
      const starPositions = [];
      const starColors = [];
      const sCol = new THREE.Color();

      for (let i = 0; i < starCount; i++) {
        const u = starRng();
        const v = 0.22 + starRng() * 0.76;
        const theta = u * Math.PI * 2;
        const phi = Math.acos(v);
        const r = 142;

        const sx = r * Math.sin(phi) * Math.cos(theta);
        const sy = r * Math.cos(phi);
        const sz = r * Math.sin(phi) * Math.sin(theta);
        starPositions.push(sx, sy, sz);

        const altitudeFade = Math.pow((v - 0.20) / 0.80, 1.35);
        const twinkleBase = 0.45 + starRng() * 0.55;
        const lum = altitudeFade * twinkleBase;

        if (starRng() > 0.72) {
          sCol.setRGB(lum * 1.0, lum * 0.92, lum * 0.78);
        } else {
          sCol.setRGB(lum * 0.86, lum * 0.93, lum * 1.0);
        }
        starColors.push(sCol.r, sCol.g, sCol.b);
      }

      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
      starGeo.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
      const starMat = new THREE.PointsMaterial({
        size: 1.35,
        map: starSpriteTex,
        vertexColors: true,
        transparent: true,
        opacity: 0.92,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false
      });
      const starField = new THREE.Points(starGeo, starMat);
      scene.add(starField);

      // 4. Pass 3 Real-Time Planar Mirror Reflection + Multi-Octave Fresnel Wave Water Surface
      const waterGeo = new THREE.PlaneGeometry(220, 220, 128, 128);
      waterGeo.rotateX(-Math.PI / 2);

      const waterMat = new THREE.ShaderMaterial({
        uniforms: waterUniforms,
        vertexShader: `
          varying vec3 vWorldPos;
          varying vec4 vClipPos;
          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPos = worldPosition.xyz;
            vClipPos = projectionMatrix * viewMatrix * worldPosition;
            gl_Position = vClipPos;
          }
        `,
        fragmentShader: `
          uniform sampler2D uReflectionMap;
          uniform float uTime;
          uniform vec3 uLanternPositions[17];

          varying vec3 vWorldPos;
          varying vec4 vClipPos;

          // Compute 5-octave directional wind wave + concentric lantern/torii ripple gradient (dH/dx, dH/dz)
          vec2 computeWaveGradient(vec2 p, float t, float detailAtten) {
            vec2 grad = vec2(0.0);

            // Octave 1: Gentle primary cove swell
            vec2 k1 = vec2(1.15, 1.85);
            float ph1 = dot(p, k1) - t * 1.05;
            grad += k1 * cos(ph1) * 0.010;

            // Octave 2: Crossed twilight breeze wave
            vec2 k2 = vec2(-1.65, 2.35);
            float ph2 = dot(p, k2) - t * 1.35 + 1.3;
            grad += k2 * cos(ph2) * 0.0075;

            // Octave 3: Warped chop wavelets
            vec2 wp = p + 0.16 * vec2(sin(p.y * 1.5 + t * 0.6), cos(p.x * 1.4 - t * 0.5));
            vec2 k3 = vec2(2.8, -3.6);
            float ph3 = dot(wp, k3) + t * 1.75;
            grad += k3 * cos(ph3) * 0.0052 * detailAtten;

            // Octave 4: Horizontal wavelet ribbons (breaks vertical reflections into shimmering water bands)
            vec2 k4a = vec2(1.8, 7.8);
            vec2 k4b = vec2(-2.1, 8.6);
            grad += k4a * cos(dot(p, k4a) - t * 2.35) * 0.0036 * detailAtten;
            grad += k4b * cos(dot(p, k4b) + t * 2.55) * 0.0032 * detailAtten;

            // Octave 5: Fine capillary ripples near foreground
            vec2 k5a = vec2(4.2, 13.5);
            vec2 k5b = vec2(-4.6, 12.8);
            grad += k5a * cos(dot(p, k5a) - t * 3.1) * 0.0018 * detailAtten;
            grad += k5b * cos(dot(p, k5b) + t * 3.3) * 0.0016 * detailAtten;

            // Concentric radial ripples from the 2 submerged Torii gate pillars
            vec2 toriiP1 = vec2(-2.3, -2.0);
            vec2 toriiP2 = vec2(2.3, -2.0);
            vec2 dT1 = p - toriiP1;
            float rT1 = length(dT1);
            if (rT1 > 0.25 && rT1 < 3.4) {
              float envT1 = exp(-rT1 * 0.95) * smoothstep(0.25, 0.55, rT1);
              grad += (dT1 / rT1) * cos(rT1 * 13.0 - t * 2.6) * 0.032 * envT1 * detailAtten;
            }
            vec2 dT2 = p - toriiP2;
            float rT2 = length(dT2);
            if (rT2 > 0.25 && rT2 < 3.4) {
              float envT2 = exp(-rT2 * 0.95) * smoothstep(0.25, 0.55, rT2);
              grad += (dT2 / rT2) * cos(rT2 * 13.0 - t * 2.6 + 1.2) * 0.032 * envT2 * detailAtten;
            }

            return grad;
          }

          void main() {
            vec2 xz = vWorldPos.xz;
            vec3 viewVec = cameraPosition - vWorldPos;
            float viewDist = length(viewVec);
            vec3 V = viewVec / max(viewDist, 0.0001);

            float detailAtten = 1.0 - 0.78 * smoothstep(6.0, 42.0, viewDist);
            vec2 waveGrad = computeWaveGradient(xz, uTime, detailAtten);

            // Accumulate concentric lantern ripples, under-base meniscus occlusion & crisp wavelet glints
            vec3 lanternSpecGlints = vec3(0.0);
            float underBaseOcclusion = 1.0;

            for (int i = 0; i < 17; i++) {
              vec3 lPos = uLanternPositions[i];
              vec2 dL = xz - lPos.xz;
              float rL = length(dL);

              // Concentric circular ripple rings around each drifting paper lantern
              if (rL > 0.08 && rL < 1.65) {
                float ringEnv = exp(-rL * 1.85) * smoothstep(0.08, 0.24, rL) * (1.0 - smoothstep(1.20, 1.65, rL));
                float ringPhase = rL * 18.0 - uTime * 3.6 + float(i) * 1.37;
                waveGrad += (dL / rL) * cos(ringPhase) * 0.024 * ringEnv * detailAtten;
              }

              // Dark contact meniscus directly underneath the 0.35x0.35m cedar float board
              vec2 boxD = abs(dL);
              float boxDist = max(boxD.x, boxD.y);
              float baseMask = smoothstep(0.165, 0.225, boxDist);
              underBaseOcclusion *= baseMask;
            }

            vec3 N = normalize(vec3(-waveGrad.x, 1.0, -waveGrad.y));
            vec3 R = reflect(-V, N);
            float waveTilt = smoothstep(0.008, 0.042, length(waveGrad));

            // Crisp wavelet-crest specular glints near floating paper lanterns (smoothly zeroed at dL = 0.95)
            for (int i = 0; i < 17; i++) {
              vec3 lPos = uLanternPositions[i] + vec3(0.0, 0.22, 0.0);
              vec3 toL = lPos - vWorldPos;
              float distSq = dot(toL, toL);
              if (distSq < 0.90) {
                float dL = sqrt(distSq);
                vec3 L = toL / dL;
                vec3 H = normalize(L + V);
                float ndoth = max(0.0, dot(N, H));
                float radialWindow = exp(-dL * 3.2) * smoothstep(0.15, 0.24, dL) * (1.0 - smoothstep(0.60, 0.95, dL));
                float glint = pow(ndoth, 110.0) * waveTilt;
                lanternSpecGlints = max(lanternSpecGlints, vec3(1.10, 0.46, 0.08) * glint * radialWindow);
              }
            }

            // Planar Mirror Reflection UV with 5-tap horizontal wavelet shimmer dispersion
            vec2 ndc = vClipPos.xy / vClipPos.w;
            vec2 baseReflUV = vec2(ndc.x * 0.5 + 0.5, -ndc.y * 0.5 + 0.5);

            float distUVScale = clamp(1.0 / (1.0 + viewDist * 0.045), 0.22, 1.0);
            vec2 waveOffset = vec2(N.x * 0.028, N.z * 0.046) * distUVScale;

            // Multi-tap wavelet sampling creates broken horizontal water-ripple streaks on bright reflections
            vec2 shimmerStep = vec2(N.z * 0.0045, N.x * 0.009) * distUVScale;
            vec2 uv0 = clamp(baseReflUV + waveOffset, vec2(0.002), vec2(0.998));
            vec2 uv1 = clamp(baseReflUV + waveOffset + shimmerStep, vec2(0.002), vec2(0.998));
            vec2 uv2 = clamp(baseReflUV + waveOffset - shimmerStep, vec2(0.002), vec2(0.998));
            vec2 uv3 = clamp(baseReflUV + waveOffset * 1.28 + shimmerStep * 1.6, vec2(0.002), vec2(0.998));
            vec2 uv4 = clamp(baseReflUV + waveOffset * 0.72 - shimmerStep * 1.6, vec2(0.002), vec2(0.998));

            vec3 refl0 = texture2D(uReflectionMap, uv0).rgb;
            vec3 refl1 = texture2D(uReflectionMap, uv1).rgb;
            vec3 refl2 = texture2D(uReflectionMap, uv2).rgb;
            vec3 refl3 = texture2D(uReflectionMap, uv3).rgb;
            vec3 refl4 = texture2D(uReflectionMap, uv4).rgb;

            vec3 reflCol = refl0 * 0.38 + (refl1 + refl2) * 0.20 + (refl3 + refl4) * 0.11;
            vec3 reflPeak = max(refl0, max(refl1, refl2));
            float crestFactor = smoothstep(0.004, 0.028, abs(N.z) + abs(N.x));
            reflCol = mix(reflCol, reflPeak * 1.08, crestFactor * 0.30);

            // Water absorption keeps passive background reflections deep midnight indigo
            // while preserving vivid reflections of warm shoji screens, lanterns, torii & crimson foliage
            float reflLum = max(reflCol.r, max(reflCol.g, reflCol.b));
            float reflWarmth = max(0.0, reflCol.r - reflCol.b * 0.65);
            float subjectPreserve = clamp(smoothstep(0.05, 0.35, reflWarmth) + smoothstep(0.28, 0.85, reflLum), 0.0, 1.0);
            vec3 waterAbsorptionTint = mix(vec3(0.48, 0.55, 0.76), vec3(0.96, 0.92, 0.86), subjectPreserve);
            reflCol *= waterAbsorptionTint;

            // Physical Schlick Fresnel
            float NdotV = max(0.02, dot(N, V));
            float fresnel = clamp(0.28 + 0.64 * pow(1.0 - NdotV, 2.6), 0.28, 0.92);

            // Deep twilight water body absorption color + subtle wavelet sky sheen
            vec3 deepWaterBody = vec3(0.004, 0.009, 0.022);
            vec3 duskSkySheen = vec3(0.014, 0.022, 0.048) * clamp(R.y * 0.5 + 0.5, 0.0, 1.0) * crestFactor;

            vec3 waterColor = mix(deepWaterBody, reflCol + duskSkySheen, fresnel);
            waterColor += lanternSpecGlints;
            waterColor *= underBaseOcclusion;

            // Smooth horizon blend into deep twilight mountain base haze
            float wDistFade = smoothstep(22.0, 56.0, length(xz));
            vec3 indigoHorizonHaze = vec3(0.012, 0.017, 0.038);
            waterColor = mix(waterColor, indigoHorizonHaze, wDistFade * 0.88);

            gl_FragColor = vec4(waterColor, 1.0);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }
        `,
        transparent: false
      });

      waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.position.y = 0.0;
      waterMesh.receiveShadow = false;
      scene.add(waterMesh);

      // 5. Multi-Layered Displaced Mountain Ridge Silhouettes wrapping around the cove
      createMountainRidgeLayer({
        radius: 56,
        arcAngle: Math.PI * 1.82,
        centerAngle: -Math.PI * 0.5,
        widthSegs: 192,
        heightSegs: 18,
        baseHeight: 4.8,
        amp: 9.8,
        seed: 1.2,
        peakColorHex: 0x131a2d,
        midColorHex: 0x1a2138,
        hazeColorHex: 0x1d233b
      });

      createMountainRidgeLayer({
        radius: 76,
        arcAngle: Math.PI * 1.88,
        centerAngle: -Math.PI * 0.5,
        widthSegs: 192,
        heightSegs: 18,
        baseHeight: 7.5,
        amp: 13.5,
        seed: 3.7,
        peakColorHex: 0x192136,
        midColorHex: 0x242a44,
        hazeColorHex: 0x282945
      });

      createMountainRidgeLayer({
        radius: 96,
        arcAngle: Math.PI * 1.92,
        centerAngle: -Math.PI * 0.5,
        widthSegs: 192,
        heightSegs: 18,
        baseHeight: 10.8,
        amp: 17.5,
        seed: 7.4,
        peakColorHex: 0x202840,
        midColorHex: 0x30314d,
        hazeColorHex: 0x3b324b
      });
    }

    // ============================================================================
    // 6. MAIN TIMBER TORII GATE (x = 0.0, z = -2.0) — PASS 2 WOOD GRAIN & KAWARA

      const pillarSpan = 4.6;

      const pillarRadiusBottom = 0.24;
      const pillarRadiusTop = 0.20;

      [-1, 1].forEach((side, sIdx) => {
        const px = side * (pillarSpan * 0.5);

        addContactShadow(group, px, 0.006, 0, 0.72, 0.72, 0.90);

        const baseStoneGeo = scaleGeometryUVs(
          new THREE.CylinderGeometry(0.40, 0.54, 0.56, 28),
          4.0,
          1.2
        );
        const baseStone = new THREE.Mesh(baseStoneGeo, materials.granite);
        baseStone.position.set(px, 0.14, 0);

        baseStone.receiveShadow = true;

        const baseTorus = new THREE.Mesh(
          scaleGeometryUVs(new THREE.TorusGeometry(0.39, 0.045, 12, 28), 4.0, 0.6),

        hashira.receiveShadow = true;
        group.add(hashira);

        [-0.95, 0.95].forEach((zOff) => {
          addContactShadow(group, px, 0.006, zOff, 0.28, 0.28, 0.85);

          const subFootStone = new THREE.Mesh(
            scaleGeometryUVs(new THREE.CylinderGeometry(0.18, 0.24, 0.32, 20), 2.5, 0.8),

          const subNemaki = new THREE.Mesh(

          subNemaki.position.set(px, 0.34, zOff);
          group.add(subNemaki);

          const subPost = new THREE.Mesh(

            materials.vermilionTimber

          subPost.position.set(px, 0.98, zOff);
          subPost.castShadow = true;
          group.add(subPost);
        });

        [-0.65, 1.35].forEach((ty) => {
          const tie = new THREE.Mesh(
            new THREE.BoxGeometry(0.16, 0.11, 2.05),
            materials.vermilionTimber
          );
          tie.position.set(px, ty, 0);
          group.add(tie);
        });

        const subRoof = new THREE.Mesh(
          new THREE.BoxGeometry(0.40, 0.11, 2.34),
          materials.kasagiTile
        );
        subRoof.position.set(px, 1.92, 0);
        subRoof.castShadow = true;
        group.add(subRoof);

        for (let c = 0; c < 4; c++) {
          const ang = (c / 4) * Math.PI * 2 + sIdx * 0.9;
          const dist = 0.52 + (c % 2) * 0.14;
          const cobble = createSculptedBoulder(
            px + Math.cos(ang) * dist,
            0.05,
            Math.sin(ang) * dist,
            0.22,
            0.14,
            0.19,
            ang,
            50 + sIdx * 10 + c
          );
          group.add(cobble);
        }
      });

      const nuki = new THREE.Mesh(
        new THREE.BoxGeometry(pillarSpan + 1.85, 0.28, 0.22),
        materials.vermilionTimber
      );
      nuki.position.set(0, 4.35, 0);
      nuki.castShadow = true;
      group.add(nuki);

      [-1, 1].forEach((side) => {
        const px = side * (pillarSpan * 0.5);
        const kusabi = new THREE.Mesh(
          new THREE.BoxGeometry(0.58, 0.36, 0.29),

      for (let rx = -3.4; rx <= 3.4; rx += 0.34) {

      const gakuzuka = new THREE.Mesh(
        new THREE.BoxGeometry(0.58, 0.96, 0.17),
        materials.darkTimber
      );
      gakuzuka.position.set(0, 4.88, 0);
      group.add(gakuzuka);

      const plaqueTrim = new THREE.Mesh(
        new THREE.BoxGeometry(0.44, 0.74, 0.20),
        materials.brass
      );
      plaqueTrim.position.set(0, 4.88, 0);
      group.add(plaqueTrim);

      const cord = new THREE.Mesh(
        new THREE.CylinderGeometry(0.016, 0.016, 0.44, 12),
        materials.darkTimber
      );
      cord.position.set(0, 4.02, 0);
      group.add(cord);

      const lanternRoof = new THREE.Mesh(
        new THREE.ConeGeometry(0.24, 0.14, 6),

      );
      lanternRoof.position.set(0, 3.88, 0);

      const toriiLantern = new THREE.Mesh(

      );
      toriiLantern.position.set(0, 3.70, 0);
      group.add(toriiLantern);

      const lanternBaseRim = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15, 0.12, 0.06, 12),
        materials.brass
      );
      lanternBaseRim.position.set(0, 3.52, 0);
      group.add(lanternBaseRim);

      const toriiLight = new THREE.PointLight(0xff9a3c, 2.2, 9.0, 1.6);
      toriiLight.position.set(0, 3.55, 0);
      group.add(toriiLight);

      scene.add(group);
      return group;
    }

    // ============================================================================
    // 7. ARCHED WOODEN BRIDGE (TAIKOBASHI) — PASS 2 CARPENTRY, RIBS & GIBOSHI
    // ============================================================================
    function createGiboshiFinial() {
      const finial = new THREE.Group();

      const baseSleeve = new THREE.Mesh(
        new THREE.CylinderGeometry(0.076, 0.080, 0.08, 24),
        materials.brass
      );
      baseSleeve.position.y = 0.04;
      finial.add(baseSleeve);

      const patinaRing1 = new THREE.Mesh(
        new THREE.CylinderGeometry(0.072, 0.072, 0.024, 24),
        materials.verdigrisPatina
      );
      patinaRing1.position.y = 0.088;
      finial.add(patinaRing1);

      const midCollar = new THREE.Mesh(
        new THREE.TorusGeometry(0.076, 0.015, 12, 24),
        materials.brass
      );
      midCollar.rotation.x = Math.PI * 0.5;
      midCollar.position.y = 0.105;
      finial.add(midCollar);

      const patinaNeck = new THREE.Mesh(
        new THREE.CylinderGeometry(0.064, 0.074, 0.032, 24),
        materials.verdigrisPatina
      );
      patinaNeck.position.y = 0.125;
      finial.add(patinaNeck);

      const pts = [

    function createArchedBridge() {
      const bridgeGroup = new THREE.Group();
      const start = new THREE.Vector3(-5.8, 0.15, 13.8);
      const end = new THREE.Vector3(-3.3, 0.15, 4.2);
      const dir = new THREE.Vector3().subVectors(end, start);
      const length = dir.length();
      const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
      const angleY = Math.atan2(dir.x, dir.z);

      bridgeGroup.position.set(mid.x, 0, mid.z);
      bridgeGroup.rotation.y = angleY;

      const bridgeWidth = 2.15;
      const archHeight = 1.35;
      const segments = 34;

      for (let i = 0; i <= segments; i++) {
        const u = i / segments;
        const localZ = (u - 0.5) * length;
        const archY = Math.sin(u * Math.PI) * archHeight + 0.22;
        const slopeAngle = Math.atan(
          (Math.cos(u * Math.PI) * Math.PI * archHeight) / length
        );

        const plankDepth = (length / segments) * 0.80;

        const shadowStrip = new THREE.Mesh(
          new THREE.BoxGeometry(bridgeWidth - 0.12, 0.04, (length / segments) * 1.04),
          materials.darkTimber
        );
        shadowStrip.position.set(0, archY - 0.032, localZ);
        shadowStrip.rotation.x = -slopeAngle;
        bridgeGroup.add(shadowStrip);

        const plank = new THREE.Mesh(
          new THREE.BoxGeometry(bridgeWidth, 0.068, plankDepth),
          materials.bridgeWood
        );
        plank.position.set(0, archY, localZ);
        plank.rotation.x = -slopeAngle;
        plank.castShadow = true;
        plank.receiveShadow = true;
        bridgeGroup.add(plank);

        const plankCrown = new THREE.Mesh(
          new THREE.BoxGeometry(bridgeWidth - 0.06, 0.016, plankDepth * 0.84),
          materials.bridgeWood
        );
        plankCrown.position.set(0, archY + 0.036, localZ);
        plankCrown.rotation.x = -slopeAngle;
        plankCrown.receiveShadow = true;
        bridgeGroup.add(plankCrown);

        if (i % 2 === 1 && (u < 0.36 || u > 0.64)) {
          const cleat = new THREE.Mesh(
            new THREE.BoxGeometry(bridgeWidth * 0.78, 0.028, 0.045),
            materials.darkTimber
          );
          cleat.position.set(0, archY + 0.048, localZ);
          cleat.rotation.x = -slopeAngle;
          cleat.castShadow = true;
          bridgeGroup.add(cleat);
        }

        [-1, 0, 1].forEach((ribSide) => {
          const ribX = ribSide * (bridgeWidth * 0.44);
          const isOuter = ribSide !== 0;
          const stringer = new THREE.Mesh(
            new THREE.BoxGeometry(isOuter ? 0.15 : 0.13, isOuter ? 0.20 : 0.17, (length / segments) * 1.08),
            isOuter ? materials.vermilionTimber : materials.darkTimber
          );
          stringer.position.set(ribX, archY - 0.11, localZ);
          stringer.rotation.x = -slopeAngle;
          stringer.castShadow = true;
          bridgeGroup.add(stringer);

          if (isOuter) {
            const soffit = new THREE.Mesh(
              new THREE.BoxGeometry(0.17, 0.04, (length / segments) * 1.08),
              materials.darkTimber
            );
            soffit.position.set(ribX, archY - 0.21, localZ);
            soffit.rotation.x = -slopeAngle;
            bridgeGroup.add(soffit);
          }
        });
      }

      const postCount = 6;
      for (let i = 0; i <= postCount; i++) {
        const u = i / postCount;
        const localZ = (u - 0.5) * length;
        const archY = Math.sin(u * Math.PI) * archHeight + 0.22;

        const crossBeam = new THREE.Mesh(
          new THREE.BoxGeometry(bridgeWidth + 0.28, 0.14, 0.16),
          materials.darkTimber
        );
        crossBeam.position.set(0, archY - 0.22, localZ);
        crossBeam.castShadow = true;
        bridgeGroup.add(crossBeam);

        [-1, 1].forEach((side) => {
          const rx = side * (bridgeWidth * 0.46);

          const postCollar = new THREE.Mesh(
            new THREE.CylinderGeometry(0.082, 0.086, 0.10, 20),
            materials.darkTimber
          );
          postCollar.position.set(rx, archY + 0.05, localZ);
          bridgeGroup.add(postCollar);

          const post = new THREE.Mesh(
            new THREE.CylinderGeometry(0.072, 0.076, 0.78, 24),
            materials.vermilionTimber
          );
          post.position.set(rx, archY + 0.39, localZ);
          post.castShadow = true;
          bridgeGroup.add(post);

          const giboshi = createGiboshiFinial();
          giboshi.position.set(rx, archY + 0.77, localZ);
          bridgeGroup.add(giboshi);

          if (i > 0 && i < postCount) {
            const pilingX = side * (bridgeWidth * 0.38);
            const piling = new THREE.Mesh(
              new THREE.CylinderGeometry(0.095, 0.115, archY + 0.5, 20),
              materials.darkTimber
            );
            piling.position.set(pilingX, (archY - 0.3) * 0.5, localZ);
            piling.castShadow = true;
            bridgeGroup.add(piling);

            const pilingFoot = new THREE.Mesh(
              scaleGeometryUVs(new THREE.CylinderGeometry(0.14, 0.18, 0.32, 20), 2.0, 0.8),
              materials.granite
            );
            pilingFoot.position.set(pilingX, 0.06, localZ);
            bridgeGroup.add(pilingFoot);

            addContactShadow(bridgeGroup, pilingX, 0.006, localZ, 0.32, 0.32, 0.85);
          }
        });

        if (i > 0 && i < postCount) {
          const pilingTie = new THREE.Mesh(
            new THREE.BoxGeometry(bridgeWidth * 0.82, 0.09, 0.09),
            materials.darkTimber
          );
          pilingTie.position.set(0, Math.max(0.36, archY * 0.42), localZ);
          bridgeGroup.add(pilingTie);
        }

        if (i < postCount) {
          const uNext = (i + 1) / postCount;
          const zNext = (uNext - 0.5) * length;
          const yNext = Math.sin(uNext * Math.PI) * archHeight + 0.22;
          const segDz = zNext - localZ;
          const segDy = yNext - archY;
          const segLen = Math.hypot(segDz, segDy);
          const segSlope = Math.atan2(segDy, segDz);

          [-1, 1].forEach((side) => {
            const rx = side * (bridgeWidth * 0.46);
            const topRail = new THREE.Mesh(
              new THREE.BoxGeometry(0.095, 0.075, segLen + 0.04),
              materials.vermilionTimber
            );
            topRail.position.set(rx, (archY + yNext) * 0.5 + 0.68, (localZ + zNext) * 0.5);
            topRail.rotation.x = -segSlope;
            topRail.castShadow = true;
            bridgeGroup.add(topRail);

            const topRailCap = new THREE.Mesh(
              new THREE.BoxGeometry(0.105, 0.024, segLen + 0.04),
              materials.darkTimber
            );
            topRailCap.position.set(rx, (archY + yNext) * 0.5 + 0.725, (localZ + zNext) * 0.5);
            topRailCap.rotation.x = -segSlope;
            bridgeGroup.add(topRailCap);

            const midRail = new THREE.Mesh(
              new THREE.BoxGeometry(0.068, 0.055, segLen + 0.02),
              materials.bridgeWood
            );
            midRail.position.set(rx, (archY + yNext) * 0.5 + 0.40, (localZ + zNext) * 0.5);
            midRail.rotation.x = -segSlope;
            bridgeGroup.add(midRail);

            const lowRail = new THREE.Mesh(
              new THREE.BoxGeometry(0.075, 0.05, segLen + 0.02),
              materials.darkTimber
            );
            lowRail.position.set(rx, (archY + yNext) * 0.5 + 0.14, (localZ + zNext) * 0.5);
            lowRail.rotation.x = -segSlope;
            bridgeGroup.add(lowRail);

            const subMidU = (u + uNext) * 0.5;
            const subMidZ = (subMidU - 0.5) * length;
            const subMidY = Math.sin(subMidU * Math.PI) * archHeight + 0.22;
            const baluster = new THREE.Mesh(
              new THREE.BoxGeometry(0.042, 0.54, 0.042),
              materials.vermilionTimber
            );
            baluster.position.set(rx, subMidY + 0.41, subMidZ);
            bridgeGroup.add(baluster);
          });
        }
      }

      [-0.5, 0.5].forEach((endFactor) => {
        const abutment = new THREE.Mesh(
          new THREE.BoxGeometry(bridgeWidth + 0.56, 0.48, 0.96),
          materials.granite
        );
        abutment.position.set(0, 0.10, endFactor * length);
        abutment.castShadow = true;
        abutment.receiveShadow = true;
        bridgeGroup.add(abutment);
      });

      scene.add(bridgeGroup);
      return bridgeGroup;
    }

        const vx = pAttr.getX(i);
        const vy = pAttr.getY(i);

        const radialScale = 0.90 + n * 0.22;
        pAttr.setX(i, vx * radialScale);

      plinthGeo.computeVertexNormals();

    function evaluateIrimoyaRoofElevation(x, z, width, depth, height) {
      const ridgeHalfSpan = width * 0.25;
      const absZ = Math.abs(z) / (depth * 0.5);
      const excessX = Math.max(0, (Math.abs(x) - ridgeHalfSpan) / (width * 0.5 - ridgeHalfSpan));
      // Smooth hip blend eliminates any diagonal stair-stepping crease along the hip ridges
      const maxD = Math.max(absZ, excessX);
      const minD = Math.min(absZ, excessX);
      const slopeDist = Math.min(1.0, maxD + 0.06 * minD);
      const elevFrac = Math.pow(1.0 - slopeDist, 1.38);
      const absXNorm = Math.abs(x) / (width * 0.5);
      const cornerFlare = Math.pow(absXNorm * absZ, 2.0) * 0.22;
      return {
        y: elevFrac * height + cornerFlare,
        slopeDist
      };
    }

    function buildCurvedIrimoyaRoofGeometry(width, depth, height, segsX = 48, segsZ = 32) {
      const geo = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let iz = 0; iz <= segsZ; iz++) {
        const vz = iz / segsZ;
        const z = (vz - 0.5) * depth;

        for (let ix = 0; ix <= segsX; ix++) {
          const ux = ix / segsX;
          const x = (ux - 0.5) * width;

          const { y, slopeDist } = evaluateIrimoyaRoofElevation(x, z, width, depth, height);
          positions.push(x, y, z);
          uvs.push(ux, slopeDist);
        }
      }

      const stride = segsX + 1;
      for (let iz = 0; iz < segsZ; iz++) {
        for (let ix = 0; ix < segsX; ix++) {
          const a = iz * stride + ix;
          const b = iz * stride + (ix + 1);
          const c = (iz + 1) * stride + (ix + 1);
          const d = (iz + 1) * stride + ix;
          indices.push(a, c, b);
          indices.push(a, d, c);
        }
      }

      geo.setIndex(indices);
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.computeVertexNormals();
      return geo;
    }
