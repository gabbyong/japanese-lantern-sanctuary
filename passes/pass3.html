      return sanctuary;
    }

    // ============================================================================
    // 10. ORGANIC SCULPTED ROCK-AND-MOSS ISLANDS & BOULDER CLUSTERS (PASS 2)
    // ============================================================================
    const baseBoulderGeo = scaleGeometryUVs(new THREE.IcosahedronGeometry(1.0, 3), 2.5, 2.5);

    function createSculptedBoulder(x, y, z, rx, ry, rz, rotY = 0, seed = 1) {
      const geo = baseBoulderGeo.clone();
      const pos = geo.attributes.position;

      for (let i = 0; i < pos.count; i++) {
        let vx = pos.getX(i);
        let vy = pos.getY(i);
        let vz = pos.getZ(i);

        const n1 = fbm3D(vx * 1.2 + seed * 3.1, vy * 1.2, vz * 1.2 - seed * 2.3, 3, seed);
        const n2 = noise3D(vx * 2.4 - seed, vy * 2.4 + seed, vz * 2.4, seed + 17);
        const disp = 0.78 + n1 * 0.36 + (n2 - 0.5) * 0.10;

        vx *= disp * rx;
        vy *= disp * ry;
        vz *= disp * rz;

        if (vy < -ry * 0.45) {
          vy = -ry * 0.45 + (vy + ry * 0.45) * 0.25;
        }

        pos.setXYZ(i, vx, vy, vz);
      }
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(geo, materials.boulderRock);
      mesh.position.set(x, y, z);
      mesh.rotation.y = rotY;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function buildOrganicIslandMesh(radiusX, radiusZ, height, radialSegs = 60, ringSegs = 18, seed = 1) {
      const geo = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let ir = 0; ir <= ringSegs; ir++) {
        const v = ir / ringSegs;

        for (let it = 0; it <= radialSegs; it++) {
          const u = it / radialSegs;
          const theta = u * Math.PI * 2;
          const cosT = Math.cos(theta);
          const sinT = Math.sin(theta);

          const nLow = fbm2D(cosT * 1.7 + seed * 2.1, sinT * 1.7 - seed * 1.5, 4, seed);
          const nHigh = fbm2D(cosT * 4.2 - seed, sinT * 4.2 + seed, 3, seed + 41);
          const cragMod = 0.76 + (nLow - 0.5) * 0.46 + (nHigh - 0.5) * 0.20;

          const rScale = Math.pow(v, 0.88) * (1.0 + 0.16 * Math.sin(v * Math.PI));
          const x = cosT * radiusX * rScale * (0.25 + 0.75 * cragMod);
          const z = sinT * radiusZ * rScale * (0.25 + 0.75 * cragMod);

          let yElev;
          if (v < 0.55) {
            const plateauHummock = fbm2D(x * 0.48 + seed, z * 0.48 - seed, 3, seed + 77);
            yElev = height * (0.86 + (1.0 - v / 0.55) * 0.16 + (plateauHummock - 0.5) * 0.22);
          } else if (v < 0.86) {
            const shoreT = (v - 0.55) / 0.31;
            const ledgeNoise = fbm2D(x * 0.85, z * 0.85, 3, seed + 99);
            const strataStep = Math.sin(shoreT * Math.PI * 2.5) * 0.04;
            yElev = height * (0.86 * (1.0 - shoreT) + 0.10 * shoreT) + (ledgeNoise - 0.5) * 0.12 + strataStep;
          } else {
            const subT = (v - 0.86) / 0.14;
            yElev = Math.max(-0.006, height * 0.10 * (1.0 - subT) - 0.08 * subT);
          }

          positions.push(x, yElev, z);
          uvs.push(x * 0.45 + 0.5, z * 0.45 + 0.5);
        }
      }

      const stride = radialSegs + 1;
      for (let ir = 0; ir < ringSegs; ir++) {
        for (let it = 0; it < radialSegs; it++) {
          const a = ir * stride + it;
          const b = (ir + 1) * stride + it;
          const c = (ir + 1) * stride + (it + 1);
          const d = ir * stride + (it + 1);
          indices.push(a, d, b);
          indices.push(b, d, c);
        }
      }

      geo.setIndex(indices);
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(geo, materials.shorelineRock);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    let islandSeedCounter = 10;
    function createShoreIsland(x, z, radiusX, radiusZ, height = 0.54) {
      const seed = islandSeedCounter++;
      const group = new THREE.Group();
      group.position.set(x, 0, z);

      addContactShadow(group, 0, 0.004, 0, radiusX * 0.84, radiusZ * 0.84, 0.58);

      const islandMesh = buildOrganicIslandMesh(radiusX, radiusZ, height, 60, 18, seed);
      group.add(islandMesh);

      const rng = seededRandom(seed * 131 + 17);
      const boulderCount = Math.round(9 + (radiusX + radiusZ) * 2.2);
      for (let i = 0; i < boulderCount; i++) {
        const ang = (i / boulderCount) * Math.PI * 2 + (rng() - 0.5) * 0.38;
        const distFactor = 0.72 + rng() * 0.34;
        const bx = Math.cos(ang) * radiusX * distFactor;
        const bz = Math.sin(ang) * radiusZ * distFactor;

        const isLarge = i % 3 === 0;
        const brx = isLarge ? 0.32 + rng() * 0.26 : 0.16 + rng() * 0.16;
        const bry = isLarge ? 0.20 + rng() * 0.18 : 0.10 + rng() * 0.10;
        const brz = isLarge ? 0.28 + rng() * 0.24 : 0.15 + rng() * 0.15;
        const by = isLarge ? 0.08 + rng() * 0.10 : 0.03 + rng() * 0.06;

        const boulder = createSculptedBoulder(bx, by, bz, brx, bry, brz, rng() * Math.PI * 2, seed * 20 + i);
        group.add(boulder);
      }

      scene.add(group);
      return group;
    }

    // ============================================================================
    // 10B. PASS 3 SCULPTED JAPANESE MAPLE (MOMIJI) WITH LAYERED PALMATE LEAF CARDS
    // ============================================================================
    const baseLeafBoughCardGeo = (() => {
      const geo = new THREE.PlaneGeometry(1.18, 1.18, 2, 2);
      geo.rotateX(-Math.PI * 0.5);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vz = pos.getZ(i);
        const r2 = vx * vx + vz * vz;
        // Gentle natural botanical dome arch so leaf cards are cupped, never flat planes
        const archY = 0.14 * (1.0 - r2 * 1.4);
        pos.setY(i, archY);
      }
      geo.computeVertexNormals();
      return geo;
    })();

    const limbUpVec = new THREE.Vector3(0, 1, 0);
    function addTaperedLimbSegment(parent, p0, p1, rBottom, rTop, radialSegs = 10) {
      const diff = new THREE.Vector3().subVectors(p1, p0);
      const len = diff.length();
      if (len < 1e-4) return null;
      const geo = scaleGeometryUVs(
        new THREE.CylinderGeometry(rTop, rBottom, len + 0.04, radialSegs, 1),
        1.4,
        len * 1.2
      );
      const mesh = new THREE.Mesh(geo, materials.trunkBark);
      mesh.position.addVectors(p0, p1).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(limbUpVec, diff.normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function createMapleTree(x, y, z, scale = 1.0, seed = 1) {
      const tree = new THREE.Group();
      tree.position.set(x, y, z);
      tree.scale.setScalar(scale);

      const rng = seededRandom(seed * 919 + 37);

      // Lean slightly toward the water channel (x = 0) for picturesque Japanese garden composition
      const waterLeanX = x < 0 ? 0.18 : -0.18;
      const waterLeanZ = (rng() - 0.5) * 0.14;

      // 1. Flared Gnarled Root Buttresses (nebari) gripping the mossy island
      for (let r = 0; r < 5; r++) {
        const rAng = (r / 5) * Math.PI * 2 + (rng() - 0.5) * 0.35;
        const rOut = 0.34 + rng() * 0.14;
        addTaperedLimbSegment(
          tree,
          new THREE.Vector3(Math.cos(rAng) * rOut, -0.04, Math.sin(rAng) * rOut),
          new THREE.Vector3(Math.cos(rAng) * 0.09, 0.36 + rng() * 0.10, Math.sin(rAng) * 0.09),
          0.075,
          0.12,
          8
        );
      }

      // 2. Curved Multi-Segment Gnarled Trunk
      const t0 = new THREE.Vector3(0, -0.02, 0);
      const t1 = new THREE.Vector3(waterLeanX * 0.35, 0.58, waterLeanZ * 0.4);
      const t2 = new THREE.Vector3(waterLeanX * 0.85, 1.18, waterLeanZ * 0.85);
      const t3 = new THREE.Vector3(waterLeanX * 1.15, 1.68, waterLeanZ * 1.1);

      addTaperedLimbSegment(tree, t0, t1, 0.27, 0.21, 12);
      addTaperedLimbSegment(tree, t1, t2, 0.21, 0.165, 12);
      addTaperedLimbSegment(tree, t2, t3, 0.165, 0.125, 10);

      // 3. Multi-Tiered Primary, Secondary & Tertiary Branch Skeleton + Cloud-Pruned (Tamamono) Bough Pads
      const boughPads = [
        // Lower water-reaching tier
        {
          origin: t2,
          mid: new THREE.Vector3(waterLeanX * 2.8 + (x < 0 ? 0.55 : -0.55), 1.58, 0.48),
          tip: new THREE.Vector3(waterLeanX * 4.2 + (x < 0 ? 0.92 : -0.92), 1.82, 0.78),
          rx: 1.28,
          ry: 0.46,
          rz: 1.18,
          hueBias: 0.85 // golden-orange water-facing tier
        },
        // Left spreading tier
        {
          origin: t2,
          mid: new THREE.Vector3(-0.62, 1.72, 0.28),
          tip: new THREE.Vector3(-1.12, 2.08, 0.46),
          rx: 1.32,
          ry: 0.48,
          rz: 1.22,
          hueBias: 0.25 // rich crimson-scarlet
        },
        // Right spreading tier
        {
          origin: t2,
          mid: new THREE.Vector3(0.66, 1.78, -0.24),
          tip: new THREE.Vector3(1.18, 2.18, -0.42),
          rx: 1.34,
          ry: 0.48,
          rz: 1.24,
          hueBias: 0.55 // fiery vermilion-persimmon
        },
        // Rear lower-mid tier
        {
          origin: t2,
          mid: new THREE.Vector3(-0.24, 1.82, -0.58),
          tip: new THREE.Vector3(-0.48, 2.25, -1.04),
          rx: 1.24,
          ry: 0.46,
          rz: 1.18,
          hueBias: 0.15 // deep autumn crimson
        },
        // Forward mid-upper tier
        {
          origin: t3,
          mid: new THREE.Vector3(0.38, 2.15, 0.48),
          tip: new THREE.Vector3(0.68, 2.52, 0.82),
          rx: 1.22,
          ry: 0.45,
          rz: 1.15,
          hueBias: 0.70 // vermilion-gold
        },
        // Upper-left crown tier
        {
          origin: t3,
          mid: new THREE.Vector3(-0.42, 2.28, -0.18),
          tip: new THREE.Vector3(-0.72, 2.68, -0.32),
          rx: 1.26,
          ry: 0.46,
          rz: 1.20,
          hueBias: 0.40 // scarlet-vermilion
        },
        // Apex crown cloud tier
        {
          origin: t3,
          mid: new THREE.Vector3(waterLeanX * 1.3, 2.42, 0.05),
          tip: new THREE.Vector3(waterLeanX * 1.4, 2.96, 0.08),
          rx: 1.42,
          ry: 0.52,
          rz: 1.34,
          hueBias: 0.62 // sunlit vermilion-amber crown
        }
      ];

      boughPads.forEach((pad) => {
        const tuckedTip = new THREE.Vector3(pad.tip.x * 0.92, pad.tip.y - 0.12, pad.tip.z * 0.92);
        addTaperedLimbSegment(tree, pad.origin, pad.mid, 0.105, 0.068, 8);
        addTaperedLimbSegment(tree, pad.mid, tuckedTip, 0.068, 0.036, 7);

        // Secondary fork sub-branches tucked beneath the foliage cloud
        for (let s = 0; s < 3; s++) {
          const sAng = (s / 3) * Math.PI * 2 + rng() * 1.2;
          const subTip = new THREE.Vector3(
            tuckedTip.x + Math.cos(sAng) * pad.rx * 0.34,
            tuckedTip.y - 0.08 + (rng() - 0.5) * 0.12,
            tuckedTip.z + Math.sin(sAng) * pad.rz * 0.34
          );
          addTaperedLimbSegment(tree, pad.mid, subTip, 0.048, 0.022, 6);
        }
      });

      // 4. Build Dense Merged Cloud-Pruned Canopy of 308 Curved Palmate Leaf-Bough Cards
      const basePos = baseLeafBoughCardGeo.attributes.position;
      const baseNorm = baseLeafBoughCardGeo.attributes.normal;
      const baseUV = baseLeafBoughCardGeo.attributes.uv;
      const baseIndex = baseLeafBoughCardGeo.index;

      const mergedPositions = [];
      const mergedNormals = [];
      const mergedUVs = [];
      const mergedColors = [];
      const mergedIndices = [];
      let vertexOffset = 0;

      const dummyObj = new THREE.Object3D();
      const vPos = new THREE.Vector3();
      const vNorm = new THREE.Vector3();
      const normalMat3 = new THREE.Matrix3();

      // Warm carotenoid-preserving vertex color modulators (prevents squaring green channel to zero under AgX!)
      const innerCrimson = new THREE.Color(0x5c3228);
      const midScarlet = new THREE.Color(0x965038);
      const brightVermilion = new THREE.Color(0xc47244);
      const goldenAmber = new THREE.Color(0xe6a856);
      const cardColor = new THREE.Color();

      const cardsPerPad = 44; // 7 pads * 44 cards = 308 layered leaf-bough cards per tree!
      boughPads.forEach((pad) => {
        for (let c = 0; c < cardsPerPad; c++) {
          // Layered phyllotaxis distribution within each horizontal cloud-pruned pad
          const layerFrac = c / (cardsPerPad - 1);
          const goldenAngle = c * 2.3999632 + rng() * 0.35;
          const radialDist = Math.pow(layerFrac, 0.56) * (0.20 + 0.80 * rng());

          const lx = Math.cos(goldenAngle) * pad.rx * radialDist;
          const lz = Math.sin(goldenAngle) * pad.rz * radialDist;
          // Dome-shaped cloud profile: higher in center, drooping gracefully at perimeter
          const domeProfile = Math.cos(radialDist * Math.PI * 0.46);
          const ly = (domeProfile - 0.30) * pad.ry + (rng() - 0.5) * 0.22;

          dummyObj.position.set(pad.tip.x + lx, pad.tip.y + ly, pad.tip.z + lz);

          // Orient card so it drapes naturally outward from pad center with varied pitch/roll for 3D volume from all angles
          const outAngle = Math.atan2(lx, lz);
          const droopPitch = 0.24 + radialDist * 0.54 + (rng() - 0.5) * 0.48;
          const rollTilt = (rng() - 0.5) * 0.68;
          dummyObj.rotation.set(droopPitch, outAngle + (rng() - 0.5) * 0.9, rollTilt, 'YXZ');

          const cardScale = (0.76 + (1.0 - radialDist * 0.30) * 0.36) * (0.88 + rng() * 0.24);
          dummyObj.scale.setScalar(cardScale);
          dummyObj.updateMatrix();
          normalMat3.getNormalMatrix(dummyObj.matrix);

          // Compute rich autumn color gradient from shaded inner bough core to luminous outer tips
          const exposureFactor = Math.min(1.0, Math.max(0.0, radialDist * 0.65 + (ly + pad.ry) / (pad.ry * 2.2) * 0.45));
          const hueT = Math.min(1.0, Math.max(0.0, exposureFactor * 0.72 + pad.hueBias * 0.35 + (rng() - 0.5) * 0.18));

          if (hueT < 0.36) {
            cardColor.lerpColors(innerCrimson, midScarlet, hueT / 0.36);
          } else if (hueT < 0.74) {
            cardColor.lerpColors(midScarlet, brightVermilion, (hueT - 0.36) / 0.38);
          } else {
            cardColor.lerpColors(brightVermilion, goldenAmber, (hueT - 0.74) / 0.26);
          }

          const flipU = rng() > 0.5;
          const flipV = rng() > 0.5;

          for (let vi = 0; vi < basePos.count; vi++) {
            vPos.fromBufferAttribute(basePos, vi).applyMatrix4(dummyObj.matrix);
            vNorm.fromBufferAttribute(baseNorm, vi).applyMatrix3(normalMat3).normalize();

            mergedPositions.push(vPos.x, vPos.y, vPos.z);
            mergedNormals.push(vNorm.x, vNorm.y, vNorm.z);

            const u = flipU ? 1.0 - baseUV.getX(vi) : baseUV.getX(vi);
            const v = flipV ? 1.0 - baseUV.getY(vi) : baseUV.getY(vi);
            mergedUVs.push(u, v);

            const vTipBoost = 0.90 + 0.12 * (1.0 - Math.hypot(u - 0.5, v - 0.5));
            mergedColors.push(
              Math.min(1, cardColor.r * vTipBoost),
              Math.min(1, cardColor.g * vTipBoost),
              Math.min(1, cardColor.b * vTipBoost)
            );
          }

          for (let ii = 0; ii < baseIndex.count; ii++) {
            mergedIndices.push(baseIndex.getX(ii) + vertexOffset);
          }
          vertexOffset += basePos.count;
        }
      });

      const canopyGeo = new THREE.BufferGeometry();
      canopyGeo.setIndex(mergedIndices);
      canopyGeo.setAttribute('position', new THREE.Float32BufferAttribute(mergedPositions, 3));
      canopyGeo.setAttribute('normal', new THREE.Float32BufferAttribute(mergedNormals, 3));
      canopyGeo.setAttribute('uv', new THREE.Float32BufferAttribute(mergedUVs, 2));
      canopyGeo.setAttribute('color', new THREE.Float32BufferAttribute(mergedColors, 3));

      const canopyMesh = new THREE.Mesh(canopyGeo, materials.mapleFoliage);
      canopyMesh.castShadow = true;
      canopyMesh.receiveShadow = true;
      tree.add(canopyMesh);

      scene.add(tree);
      return tree;
    }

    // ============================================================================
    // 10C. PASS 3 FALLEN AUTUMN MAPLE LEAVES ON WATER, BRIDGE PLANKS & MOSSY ROCKS
    // ============================================================================
    const driftingWaterLeaves = [];

    function createFallenMapleLeaves() {
      const leafRng = seededRandom(1409);
      const leafCardGeo = new THREE.PlaneGeometry(0.38, 0.38, 1, 1);
      leafCardGeo.rotateX(-Math.PI * 0.5);

      const leafColors = [
        new THREE.Color(0x965038),
        new THREE.Color(0xc47244),
        new THREE.Color(0xe6a856),
        new THREE.Color(0x783e2e)
      ];

      function buildLeafPatchMesh(scale, colorObj) {
        const geo = leafCardGeo.clone();
        const cols = [];
        for (let i = 0; i < 4; i++) {
          cols.push(colorObj.r, colorObj.g, colorObj.b);
        }
        geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
        const mesh = new THREE.Mesh(geo, materials.mapleFoliage);
        mesh.scale.setScalar(scale);
        return mesh;
      }

      // 1. Fallen maple leaf clusters drifting gently on the water surface
      const waterLeafCoords = [
        [2.45, 2.65], [1.45, 3.15], [2.95, 3.65], [0.95, 2.10],
        [-2.10, 4.45], [-2.95, 6.20], [-1.65, 7.60], [-3.85, 9.80],
        [-4.90, 11.8], [-3.20, 2.85], [3.40, 1.85], [-4.80, -0.80],
        [4.95, -1.90], [-3.90, -10.8], [3.95, -11.0], [4.80, 7.80]
      ];
      waterLeafCoords.forEach(([wx, wz], idx) => {
        const col = leafColors[idx % leafColors.length];
        const sc = 0.72 + leafRng() * 0.45;
        const patch = buildLeafPatchMesh(sc, col);
        patch.position.set(wx, 0.009, wz);
        patch.rotation.y = leafRng() * Math.PI * 2;
        scene.add(patch);
        driftingWaterLeaves.push({
          mesh: patch,
          baseX: wx,
          baseZ: wz,
          phase: idx * 1.15 + leafRng() * 2.0
        });
      });

      // 2. Fallen maple leaves resting along the arched wooden bridge planks
      const bStart = new THREE.Vector3(-5.8, 0.15, 13.8);
      const bEnd = new THREE.Vector3(-3.3, 0.15, 4.2);
      const bDir = new THREE.Vector3().subVectors(bEnd, bStart);
      const bLen = bDir.length();
      const bMid = new THREE.Vector3().addVectors(bStart, bEnd).multiplyScalar(0.5);
      const bAngleY = Math.atan2(bDir.x, bDir.z);

      const bridgeLeafGroup = new THREE.Group();
      bridgeLeafGroup.position.set(bMid.x, 0, bMid.z);
      bridgeLeafGroup.rotation.y = bAngleY;

      const bridgeLeafUs = [0.08, 0.14, 0.21, 0.29, 0.38, 0.62, 0.73, 0.84, 0.91];
      bridgeLeafUs.forEach((u, idx) => {
        const localZ = (u - 0.5) * bLen;
        const archY = Math.sin(u * Math.PI) * 1.35 + 0.22;
        const slopeAngle = Math.atan((Math.cos(u * Math.PI) * Math.PI * 1.35) / bLen);
        const side = idx % 2 === 0 ? -1 : 1;
        const localX = side * (0.58 + leafRng() * 0.28);

        const patch = buildLeafPatchMesh(0.58 + leafRng() * 0.30, leafColors[(idx + 1) % leafColors.length]);
        patch.position.set(localX, archY + 0.048, localZ);
        patch.rotation.set(-slopeAngle, leafRng() * Math.PI * 2, 0);
        bridgeLeafGroup.add(patch);
      });
      scene.add(bridgeLeafGroup);

      // 3. Fallen maple leaves scattered on the mossy shoreline islands & stone lantern plinths
      const shoreLeafSpots = [
        [2.15, 0.34, 2.45], [1.55, 0.32, 1.95], [2.42, 0.26, 2.85],
        [-3.45, 0.36, 3.95], [-3.85, 0.34, 3.35], [-5.85, 0.42, 13.6],
        [-6.35, 0.48, -1.25], [6.55, 0.50, -2.25], [-5.15, 0.46, -11.6],
        [5.35, 0.46, -11.8], [5.95, 0.42, 8.55]
      ];
      shoreLeafSpots.forEach(([sx, sy, sz], idx) => {
        const patch = buildLeafPatchMesh(0.66 + leafRng() * 0.34, leafColors[(idx + 2) % leafColors.length]);
        patch.position.set(sx, sy, sz);
        patch.rotation.y = leafRng() * Math.PI * 2;
        scene.add(patch);
      });
    }

    // ============================================================================
    // 11. DRIFTING PAPER LANTERNS (TŌRŌ NAGASHI) — PASS 3 WATER MENISCUS GROUNDING
    // ============================================================================
    const floatingLanterns = [];

    function createFloatingPaperLantern(baseX, baseZ, phase = 0) {
      const group = new THREE.Group();
      group.position.set(baseX, 0.012, baseZ);

      // 1. Dark soft water meniscus contact shadow collar directly under cedar base
      const meniscusShadow = new THREE.Mesh(
        contactShadowGeo,
        new THREE.MeshBasicMaterial({
          color: 0x000000,
          map: contactShadowTex,
          transparent: true,
          opacity: 0.92,
          fog: false,
          depthWrite: false,
          polygonOffset: true,
          polygonOffsetFactor: -3,
          polygonOffsetUnits: -6
        })
      );
      meniscusShadow.position.y = -0.004;
      meniscusShadow.scale.set(0.54, 1, 0.54);
      group.add(meniscusShadow);
      reflectionHiddenObjects.push(meniscusShadow);

      // 2. Dark wet-wood submerged skirt collar around the base perimeter
      const meniscusRim = new THREE.Mesh(
        new THREE.BoxGeometry(0.39, 0.028, 0.39),
        materials.darkTimber
      );
      meniscusRim.position.y = 0.002;
      group.add(meniscusRim);

      // 3. Beveled cedar float board with cross-runners
      const woodBase = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, 0.036, 0.35),
        materials.cedarWood
      );
      woodBase.position.y = 0.022;
      woodBase.castShadow = true;
      woodBase.receiveShadow = true;
      group.add(woodBase);

      const baseRim = new THREE.Mesh(
        new THREE.BoxGeometry(0.28, 0.022, 0.28),
        materials.darkTimber
      );
      baseRim.position.y = 0.044;
      group.add(baseRim);

      // 4. Translucent warm washi paper sleeve
      const sleeve = new THREE.Mesh(
        new THREE.BoxGeometry(0.24, 0.32, 0.24),
        materials.paperSleeve
      );
      sleeve.position.y = 0.205;
      group.add(sleeve);

      const innerCandle = new THREE.Mesh(
        new THREE.ConeGeometry(0.035, 0.09, 8),
        materials.candleHeart
      );
      innerCandle.position.y = 0.14;
      group.add(innerCandle);

      // 5. Thin dark timber corner frames & top/bottom frame caps
      [-0.122, 0.122].forEach((fx) => {
        [-0.122, 0.122].forEach((fz) => {
          const frame = new THREE.Mesh(
            new THREE.BoxGeometry(0.022, 0.34, 0.022),
            materials.darkTimber
          );
          frame.position.set(fx, 0.205, fz);
          group.add(frame);
        });
      });

      const topFrameCap = new THREE.Mesh(
        new THREE.BoxGeometry(0.27, 0.022, 0.27),
        materials.darkTimber
      );
      topFrameCap.position.y = 0.368;
      group.add(topFrameCap);

      scene.add(group);
      floatingLanterns.push({
        group,
        baseX,
        baseZ,
        phase
      });
      return group;
    }

    // ============================================================================
    // 12. ASSEMBLE THE SANCTUARY WORLD AT CANONICAL COORDINATES
    // ============================================================================
    createEnvironment();
    createToriiGate(0.0, -2.0);
    createArchedBridge();
    createSanctuaryPavilion();

    createShoreIsland(-6.2, 14.2, 3.7, 3.1, 0.56);
    createShoreIsland(-3.5, 3.8, 1.95, 1.75, 0.46);
    createShoreIsland(2.0, 2.15, 1.78, 1.58, 0.45);
    createShoreIsland(-6.5, -1.5, 3.3, 2.9, 0.60);
    createShoreIsland(6.8, -2.5, 3.5, 3.0, 0.64);
    createShoreIsland(-5.4, -12.0, 3.0, 2.7, 0.56);
    createShoreIsland(5.6, -12.2, 3.2, 2.7, 0.58);
    createShoreIsland(6.2, 8.8, 2.7, 2.3, 0.52);

    const heroBoulderSpecs = [
      [2.68, 0.14, 2.95, 0.44, 0.28, 0.36, 0.5, 601],
      [2.22, 0.10, 3.18, 0.32, 0.20, 0.28, 1.2, 602],
      [1.38, 0.12, 2.92, 0.38, 0.24, 0.32, 2.1, 603],
      [0.92, 0.08, 2.35, 0.42, 0.25, 0.35, 0.8, 604],
      [1.15, 0.11, 1.52, 0.46, 0.28, 0.38, 1.7, 605],
      [2.85, 0.12, 1.65, 0.50, 0.32, 0.42, 2.6, 606],
      [3.12, 0.07, 2.38, 0.34, 0.18, 0.30, 0.3, 607],
      [1.68, 0.06, 3.32, 0.26, 0.12, 0.24, 1.9, 608],
      [-4.65, 0.14, 12.2, 0.52, 0.34, 0.44, 0.7, 610],
      [-5.15, 0.10, 11.4, 0.38, 0.22, 0.34, 1.4, 611],
      [-2.45, 0.12, 4.35, 0.46, 0.28, 0.38, 2.2, 612],
      [-2.85, 0.08, 5.05, 0.34, 0.20, 0.30, 0.9, 613],
      [-4.55, 0.11, 3.15, 0.48, 0.30, 0.42, 1.8, 614],
      [-4.15, 0.12, -1.15, 0.54, 0.34, 0.46, 0.4, 620],
      [4.35, 0.11, -1.75, 0.50, 0.32, 0.44, 1.5, 621],
      [-2.85, 0.12, -13.1, 0.48, 0.30, 0.42, 2.3, 622],
      [2.85, 0.12, -13.1, 0.48, 0.30, 0.42, 0.6, 623]
    ];
    heroBoulderSpecs.forEach(([bx, by, bz, rx, ry, rz, rot, seed]) => {
      addContactShadow(scene, bx, 0.006, bz, rx * 1.25, rz * 1.25, 0.80);
      scene.add(createSculptedBoulder(bx, by, bz, rx, ry, rz, rot, seed));
    });

    // Stepped Stone Lanterns (Tōrō)
    createStoneLantern(1.8, 0.22, 2.2, 1.05, true);
    createStoneLantern(-4.4, 0.24, 13.0, 0.95, true);
    createStoneLantern(-3.8, 0.18, 3.6, 0.92, true);
    createStoneLantern(-4.8, 0.26, -1.2, 1.0, false);
    createStoneLantern(4.9, 0.26, -1.8, 1.0, false);
    createStoneLantern(-2.3, 0.16, -9.5, 0.95, true);
    createStoneLantern(2.3, 0.16, -9.5, 0.95, true);
    createStoneLantern(-1.85, 0.20, -12.6, 1.0, false);
    createStoneLantern(1.85, 0.20, -12.6, 1.0, false);

    // Japanese Maple Trees (Momiji) — Lush Layered Palmate Leaf Canopies
    createMapleTree(-6.5, 0.35, -1.5, 1.15, 1);
    createMapleTree(6.8, 0.38, -2.5, 1.2, 2);
    createMapleTree(-5.2, 0.32, -11.8, 1.1, 3);
    createMapleTree(5.5, 0.34, -12.0, 1.15, 4);
    createMapleTree(6.2, 0.28, 8.8, 1.05, 5);
    createMapleTree(-7.2, 0.32, 14.5, 1.1, 6);
    createMapleTree(-5.6, 0.65, -16.8, 1.25, 7);
    createMapleTree(5.6, 0.65, -16.8, 1.25, 8);

    // Fallen Autumn Maple Leaves on Water, Bridge Planks & Shoreline Rocks
    createFallenMapleLeaves();

    // Drifting Paper Lanterns (Tōrō Nagashi) on the water
    const paperLanternCoords = [
      [2.25, 3.35, 0.4],
      [1.15, 3.95, 1.2],
      [2.65, 4.30, 2.1],
      [0.65, 2.75, 2.9],
      [-2.15, 6.6, 0.8],
      [-1.55, 5.1, 1.7],
      [-0.85, 3.2, 2.5],
      [-0.25, 1.2, 3.3],
      [0.35, -0.6, 4.1],
      [-2.8, 8.2, 0.3],
      [1.8, 7.4, 1.5],
      [-1.2, -4.2, 2.2],
      [1.2, -4.8, 3.0],
      [-0.9, -7.8, 0.9],
      [0.95, -8.4, 1.8],
      [-0.6, -10.8, 2.7],
      [0.65, -11.2, 3.5]
    ];
    paperLanternCoords.forEach(([lx, lz, phase]) => {
      createFloatingPaperLantern(lx, lz, phase);
    });

    const clusterLight1 = new THREE.PointLight(0xff9432, 1.45, 6.5, 1.6);
    clusterLight1.position.set(1.8, 0.52, 3.6);
    scene.add(clusterLight1);

    const clusterLight2 = new THREE.PointLight(0xff9432, 1.4, 6.5, 1.6);
    clusterLight2.position.set(-1.1, 0.52, 4.8);
    scene.add(clusterLight2);

    // ============================================================================
    // 13. DETERMINISTIC TIME, PLANAR REFLECTION RENDERER, CAMERA API & WASD
    // ============================================================================
    let deterministicTime = urlParams.has('t') ? parseFloat(urlParams.get('t')) : null;
    let activePresetName = 'overview';

    function updateSceneAtTime(t) {
      waterUniforms.uTime.value = t;

      for (let i = 0; i < floatingLanterns.length; i++) {
        const item = floatingLanterns[i];
        const wave = t * 0.85 + item.phase;
        item.group.position.x = item.baseX + Math.sin(wave * 0.7) * 0.08;
        item.group.position.z = item.baseZ + Math.cos(wave * 0.55) * 0.08;
        item.group.position.y = 0.012 + Math.sin(wave * 1.4) * 0.008;
        item.group.rotation.y = Math.sin(wave * 0.4) * 0.18;

        if (waterUniforms.uLanternPositions.value[i]) {
          waterUniforms.uLanternPositions.value[i].copy(item.group.position);
        }
      }

      for (let i = 0; i < driftingWaterLeaves.length; i++) {
        const lf = driftingWaterLeaves[i];
        const w = t * 0.65 + lf.phase;
        lf.mesh.position.x = lf.baseX + Math.sin(w * 0.8) * 0.05;
        lf.mesh.position.z = lf.baseZ + Math.cos(w * 0.65) * 0.05;
        lf.mesh.rotation.y = lf.phase + Math.sin(w * 0.35) * 0.14;
      }

      for (let i = 0; i < lanternFlameMeshes.length; i++) {
        const f = lanternFlameMeshes[i];
        const flk = Math.sin(t * 5.2 + f.phase) * 0.08 + Math.cos(t * 8.7 - f.phase) * 0.05;
        f.flameCore.scale.set(1.0 + flk * 0.5, 1.0 + flk, 1.0 + flk * 0.5);
        f.flameHalo.scale.setScalar(1.0 + flk * 0.7);
      }
    }

    function renderSceneWithReflection() {
      if (waterMesh) {
        waterMesh.visible = false;
        for (let i = 0; i < reflectionHiddenObjects.length; i++) {
          reflectionHiddenObjects[i].visible = false;
        }
        if (skyDomeMesh) {
          skyDomeMesh.material.color.setRGB(0.26, 0.30, 0.46);
        }

        mirrorCamera.position.set(camera.position.x, -camera.position.y, camera.position.z);
        mirrorCamera.up.set(0, 1, 0);
        mirrorCamera.fov = camera.fov;
        mirrorCamera.aspect = camera.aspect;
        mirrorCamera.near = camera.near;
        mirrorCamera.far = camera.far;
        mirrorCamera.updateProjectionMatrix();
        mirrorCamera.lookAt(controls.target.x, -controls.target.y, controls.target.z);
        mirrorCamera.updateMatrixWorld();

        const prevTarget = renderer.getRenderTarget();
        renderer.setRenderTarget(reflectionRT);
        renderer.clear();
        renderer.render(scene, mirrorCamera);
        renderer.setRenderTarget(prevTarget);

        if (skyDomeMesh) {
          skyDomeMesh.material.color.setRGB(1.0, 1.0, 1.0);
        }
        for (let i = 0; i < reflectionHiddenObjects.length; i++) {
          reflectionHiddenObjects[i].visible = true;
        }
        waterMesh.visible = true;
      }

      renderer.render(scene, camera);
    }

    // Initialize lantern positions at t = 0 so initial preset render has populated uniforms
    updateSceneAtTime(deterministicTime !== null ? deterministicTime : 0.0);

    function updateCameraUI(presetName) {
      const links = document.querySelectorAll('.camera-link');
      links.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.preset === presetName);
      });
    }

    window.__SET_CAMERA_PRESET__ = function (name) {
      const preset = CAMERA_PRESETS[name] || CAMERA_PRESETS.overview;
      activePresetName = CAMERA_PRESETS[name] ? name : 'overview';
      camera.position.set(preset.position[0], preset.position[1], preset.position[2]);
      camera.fov = preset.fov;
      camera.updateProjectionMatrix();
      controls.target.set(preset.target[0], preset.target[1], preset.target[2]);
      controls.update();
      updateCameraUI(activePresetName);
      renderSceneWithReflection();
      return {
        preset: activePresetName,
        position: [...preset.position],
        target: [...preset.target],
        fov: preset.fov
      };
    };

    window.__GET_CAMERA_STATE__ = function () {
      return {
        preset: activePresetName,
        position: [camera.position.x, camera.position.y, camera.position.z],
        target: [controls.target.x, controls.target.y, controls.target.z],
        fov: camera.fov
      };
    };

    window.__SET_CAMERA_STATE__ = function (state) {
      if (!state) return window.__GET_CAMERA_STATE__();
      if (Array.isArray(state.position) && state.position.length === 3) {
        camera.position.set(state.position[0], state.position[1], state.position[2]);
      }
      if (typeof state.fov === 'number') {
        camera.fov = state.fov;
        camera.updateProjectionMatrix();
      }
      if (Array.isArray(state.target) && state.target.length === 3) {
        controls.target.set(state.target[0], state.target[1], state.target[2]);
      }
      controls.update();
      renderSceneWithReflection();
      return window.__GET_CAMERA_STATE__();
    };

    window.__SET_DETERMINISTIC_TIME__ = function (t) {
      deterministicTime = typeof t === 'number' && !Number.isNaN(t) ? t : null;
      const effectiveT = deterministicTime !== null ? deterministicTime : performance.now() * 0.001;
      updateSceneAtTime(effectiveT);
      renderSceneWithReflection();
      return deterministicTime;
    };

    window.__SET_HUD_VISIBLE__ = function (visible) {
      document.body.classList.toggle('chromeless', !visible);
      return visible;
    };

    const cameraLinksContainer = document.getElementById('camera-links');
    Object.entries(CAMERA_PRESETS).forEach(([key, preset]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'camera-link';
      btn.dataset.preset = key;
      btn.textContent = preset.label;
      btn.addEventListener('click', () => {
        window.__SET_CAMERA_PRESET__(key);
      });
      cameraLinksContainer.appendChild(btn);
    });

    const initialPreset = urlParams.get('preset') || 'overview';
    window.__SET_CAMERA_PRESET__(initialPreset);
    if (deterministicTime !== null) {
      window.__SET_DETERMINISTIC_TIME__(deterministicTime);
    }

    const pressedKeys = new Set();
    window.addEventListener('keydown', (e) => {
      pressedKeys.add(e.code);
    });
    window.addEventListener('keyup', (e) => {
      pressedKeys.delete(e.code);
    });
    window.addEventListener('blur', () => {
      pressedKeys.clear();
    });

    const moveForward = new THREE.Vector3();
    const moveRight = new THREE.Vector3();
    const moveDelta = new THREE.Vector3();
    const worldUp = new THREE.Vector3(0, 1, 0);

    function applyKeyboardNavigation(dt) {
      if (pressedKeys.size === 0) return;
      const speed = 7.5 * dt;
      moveDelta.set(0, 0, 0);

      camera.getWorldDirection(moveForward);
      moveForward.y = 0;
      if (moveForward.lengthSq() > 1e-6) {
        moveForward.normalize();
      } else {
        moveForward.set(0, 0, -1);
      }
      moveRight.crossVectors(moveForward, worldUp).normalize();

      if (pressedKeys.has('KeyW') || pressedKeys.has('ArrowUp')) {
        moveDelta.addScaledVector(moveForward, speed);
      }
      if (pressedKeys.has('KeyS') || pressedKeys.has('ArrowDown')) {
        moveDelta.addScaledVector(moveForward, -speed);
      }
      if (pressedKeys.has('KeyD') || pressedKeys.has('ArrowRight')) {
        moveDelta.addScaledVector(moveRight, speed);
      }
      if (pressedKeys.has('KeyA') || pressedKeys.has('ArrowLeft')) {
        moveDelta.addScaledVector(moveRight, -speed);
      }
      if (pressedKeys.has('KeyE') || pressedKeys.has('Space')) {
        moveDelta.y += speed;
      }
      if (pressedKeys.has('KeyQ') || pressedKeys.has('ShiftLeft')) {
        moveDelta.y -= speed;
      }

      if (moveDelta.lengthSq() > 0) {
        camera.position.add(moveDelta);
        controls.target.add(moveDelta);
        if (camera.position.y < 0.25) {
          const lift = 0.25 - camera.position.y;
          camera.position.y += lift;
          controls.target.y += lift;
        }
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      const pr = Math.min(window.devicePixelRatio, 2);
      reflectionRT.setSize(Math.round(window.innerWidth * pr), Math.round(window.innerHeight * pr));
    });

    let lastFrameTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastFrameTime) * 0.001, 0.1);
      lastFrameTime = now;

      applyKeyboardNavigation(dt);
      controls.update();

      const t = deterministicTime !== null ? deterministicTime : now * 0.001;
      updateSceneAtTime(t);

      renderSceneWithReflection();
    }

    requestAnimationFrame(animate);
  </script>
</body>
