<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Japanese Lantern Sanctuary at Dusk — Baseline</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --ink: #f0ece1;
      --ink-muted: rgba(240, 236, 225, 0.68);
      --ink-Subtle: rgba(240, 236, 225, 0.42);
      --rule: rgba(240, 236, 225, 0.22);
      --accent: #e89b54;
      --surface: rgba(15, 19, 29, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141a29;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 36px;
      z-index: 10;
      transition: opacity 0.2s ease;
    }

    body.chromeless #hud {
      display: none !important;
    }

    .hud-header {
      max-width: 460px;
      background: var(--surface);
      padding: 16px 20px;
      border-top: 2px solid var(--accent);
    }

    .hud-kicker {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 4px;
    }

    .hud-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 400;
      line-height: 1.25;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .hud-subtitle {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ink-muted);
    }

    .hud-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .camera-nav {
      pointer-events: auto;
      background: var(--surface);
      padding: 12px 18px;
      border-top: 1px solid var(--rule);
      display: flex;
      align-items: baseline;
      gap: 20px;
    }

    .camera-nav-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-Subtle);
    }

    .camera-nav-links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .camera-link {
      appearance: none;
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      padding: 2px 0;
      font-family: inherit;
      font-size: 13px;
      color: var(--ink-muted);
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .camera-link:hover {
      color: var(--ink);
      border-bottom-color: var(--ink-muted);
    }

    .camera-link.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
      font-weight: 500;
    }

    .controls-hint {
      background: var(--surface);
      padding: 10px 16px;
      border-top: 1px solid var(--rule);
      font-size: 12px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three/build/three.module.js",
      "three/addons/": "../vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <header class="hud-header">
      <div class="hud-kicker">Architectural Sanctuary Study</div>
      <h1 class="hud-title">Floating Japanese Lantern Sanctuary at Dusk</h1>
      <p class="hud-subtitle">Water-bound timber torii, arched taikobashi footbridge, stone tōrō lanterns, and island haiden pavilion.</p>
    </header>

    <footer class="hud-footer">
      <nav class="camera-nav" aria-label="Camera Viewpoints">
        <span class="camera-nav-label">Viewpoint</span>
        <div class="camera-nav-links" id="camera-links"></div>
      </nav>
      <div class="controls-hint">
        Orbit: Left Drag &nbsp;|&nbsp; Pan: Right Drag &nbsp;|&nbsp; Fly: WASD + E/Q
      </div>
    </footer>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================================
    // 1. CANONICAL CAMERA PRESETS
    // ============================================================================
    const CAMERA_PRESETS = {
      overview: {
        position: [0, 7.5, 24],
        target: [0, 2.2, -2],
        fov: 45,
        label: 'Overview'
      },
      bridge: {
        position: [-5.5, 3.4, 11.5],
        target: [1.5, 2.4, -3.5],
        fov: 42,
        label: 'Arched bridge'
      },
      lantern_closeup: {
        position: [3.2, 1.85, 5.8],
        target: [1.8, 1.4, 2.2],
        fov: 38,
        label: 'Lantern close-up'
      },
      water_grazing: {
        position: [-2.8, 0.55, 8.5],
        target: [0.5, 1.6, -6.0],
        fov: 40,
        label: 'Water grazing'
      },
      sanctuary_interior: {
        position: [0.0, 2.8, -5.5],
        target: [0.0, 2.5, -16.5],
        fov: 46,
        label: 'Sanctuary interior'
      }
    };

    window.__CAMERA_PRESETS__ = CAMERA_PRESETS;

    // URL Parameters
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('chromeless') === '1') {
      document.body.classList.add('chromeless');
    }

    // ============================================================================
    // 2. SCENE, RENDERER, CAMERA & CONTROLS (PASS 1: AgX Tone Mapping)
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // Pass 1: AgX filmic tone mapping for natural highlight desaturation on incandescent cores
    renderer.toneMapping = THREE.AgXToneMapping;
    renderer.toneMappingExposure = 1.22;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x161d32);
    scene.fog = new THREE.Fog(0x27283e, 24, 118);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      260
    );

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxDistance = 85;
    controls.minDistance = 0.5;
    controls.maxPolarAngle = Math.PI * 0.495;

    // ============================================================================
    // 3. PASS 1 PROCEDURAL CANVAS TEXTURES (WASHI, KUMIKO SHOJI, ALCOVE, AO)
    // ============================================================================
    function seededRandom(seed) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return function () {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function createWashiPaperTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const rng = seededRandom(101);

      // Warm radial candle glow falloff from center to edges
      const grad = ctx.createRadialGradient(256, 270, 18, 256, 256, 285);
      grad.addColorStop(0.0, '#fff9eb');
      grad.addColorStop(0.28, '#ffe09e');
      grad.addColorStop(0.62, '#f5a142');
      grad.addColorStop(0.88, '#c8641e');
      grad.addColorStop(1.0, '#8a3910');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // Subtle vertical warm gradient for natural heat pooling
      const vGrad = ctx.createLinearGradient(0, 0, 0, 512);
      vGrad.addColorStop(0.0, 'rgba(60, 22, 6, 0.34)');
      vGrad.addColorStop(0.25, 'rgba(255, 190, 95, 0.05)');
      vGrad.addColorStop(0.65, 'rgba(255, 235, 175, 0.14)');
      vGrad.addColorStop(1.0, 'rgba(70, 25, 8, 0.38)');
      ctx.fillStyle = vGrad;
      ctx.fillRect(0, 0, 512, 512);

      // Mulberry (kozo) washi paper fibers
      ctx.lineWidth = 1.1;
      for (let i = 0; i < 650; i++) {
        const x = rng() * 512;
        const y = rng() * 512;
        const len = 10 + rng() * 26;
        const ang = (rng() - 0.5) * 0.7;
        ctx.strokeStyle = rng() > 0.5
          ? `rgba(255, 248, 225, ${0.04 + rng() * 0.06})`
          : `rgba(120, 52, 14, ${0.03 + rng() * 0.05})`;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        ctx.stroke();
      }

      // Delicate dark cedar horizontal kumiko ribs & top/bottom frame borders
      ctx.fillStyle = '#24150e';
      ctx.fillRect(0, 0, 512, 18);
      ctx.fillRect(0, 494, 512, 18);
      ctx.fillRect(0, 0, 14, 512);
      ctx.fillRect(498, 0, 14, 512);

      // Horizontal bamboo/cedar ribs with subtle shadow bleed
      [132, 256, 380].forEach((ry) => {
        ctx.fillStyle = 'rgba(40, 16, 6, 0.28)';
        ctx.fillRect(0, ry - 6, 512, 12);
        ctx.fillStyle = '#2b1810';
        ctx.fillRect(0, ry - 3, 512, 6);
      });

      // Vertical center muntin rib
      ctx.fillStyle = 'rgba(40, 16, 6, 0.22)';
      ctx.fillRect(256 - 5, 0, 10, 512);
      ctx.fillStyle = '#2b1810';
      ctx.fillRect(256 - 2, 0, 4, 512);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    function createShojiScreenTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const rng = seededRandom(202);

      // Base warm interior lantern falloff across the shoji screen
      const radGrad = ctx.createRadialGradient(256, 580, 30, 256, 540, 520);
      radGrad.addColorStop(0.0, '#fff6df');
      radGrad.addColorStop(0.26, '#ffde96');
      radGrad.addColorStop(0.58, '#f09b3e');
      radGrad.addColorStop(0.85, '#c46220');
      radGrad.addColorStop(1.0, '#8c3c12');
      ctx.fillStyle = radGrad;
      ctx.fillRect(0, 0, 512, 1024);

      // Subtle paper clouding & organic fiber grain per cell
      for (let i = 0; i < 1100; i++) {
        const x = rng() * 512;
        const y = rng() * 1024;
        const len = 14 + rng() * 32;
        const ang = (rng() - 0.5) * 0.45;
        ctx.strokeStyle = rng() > 0.45
          ? `rgba(255, 248, 228, ${0.04 + rng() * 0.06})`
          : `rgba(115, 48, 12, ${0.03 + rng() * 0.05})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        ctx.stroke();
      }

      // Authentic dark cedar kumiko lattice grid (4 columns x 8 rows)
      const cols = 4;
      const rows = 8;
      const cellW = 512 / cols;
      const cellH = 1024 / rows;

      // Soft ambient shadow around each lattice bar
      for (let c = 1; c < cols; c++) {
        const x = Math.round(c * cellW);
        ctx.fillStyle = 'rgba(38, 15, 5, 0.30)';
        ctx.fillRect(x - 9, 0, 18, 1024);
        ctx.fillStyle = '#261710';
        ctx.fillRect(x - 4, 0, 8, 1024);
      }

      for (let r = 1; r < rows; r++) {
        const y = Math.round(r * cellH);
        ctx.fillStyle = 'rgba(38, 15, 5, 0.30)';
        ctx.fillRect(0, y - 9, 512, 18);
        ctx.fillStyle = '#261710';
        ctx.fillRect(0, y - 4, 512, 8);
      }

      // Lower kick-panel (koshi-ita) dark cedar wainscot band at bottom of shoji
      ctx.fillStyle = '#23150f';
      ctx.fillRect(0, 930, 512, 94);
      ctx.fillStyle = '#362117';
      ctx.fillRect(14, 942, 484, 70);

      // Outer perimeter frame stiles
      ctx.fillStyle = '#20130d';
      ctx.fillRect(0, 0, 14, 1024);
      ctx.fillRect(498, 0, 14, 1024);
      ctx.fillRect(0, 0, 512, 16);
      ctx.fillRect(0, 1008, 512, 16);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    function createAlcoveBackdropTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const rng = seededRandom(303);

      // Rich golden-amber sanctuary alcove radial halo behind the sacred mirror (shinkyo)
      const grad = ctx.createRadialGradient(256, 285, 16, 256, 275, 260);
      grad.addColorStop(0.0, '#fff2cf');
      grad.addColorStop(0.24, '#f8c970');
      grad.addColorStop(0.55, '#d9842b');
      grad.addColorStop(0.82, '#914614');
      grad.addColorStop(1.0, '#4d2209');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // Subtle gold-leaf byobu screen texture & fine horizontal sudare bamboo weave lines
      for (let y = 0; y < 512; y += 4) {
        ctx.fillStyle = y % 8 === 0
          ? 'rgba(45, 18, 5, 0.14)'
          : 'rgba(255, 220, 140, 0.06)';
        ctx.fillRect(0, y, 512, 2);
      }

      for (let i = 0; i < 400; i++) {
        const x = rng() * 512;
        const y = rng() * 512;
        ctx.fillStyle = `rgba(255, 230, 160, ${0.03 + rng() * 0.05})`;
        ctx.fillRect(x, y, 8 + rng() * 18, 2 + rng() * 4);
      }

      // Vertical folding-screen (byobu) dark lacquer border ribs
      [0, 128, 384, 500].forEach((bx, idx) => {
        const w = idx === 0 || idx === 3 ? 12 : 6;
        ctx.fillStyle = '#21130d';
        ctx.fillRect(bx, 0, w, 512);
      });
      ctx.fillRect(0, 0, 512, 12);
      ctx.fillRect(0, 500, 512, 12);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    function createContactShadowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 8, 128, 128, 124);
      grad.addColorStop(0.0, 'rgba(5, 7, 14, 0.86)');
      grad.addColorStop(0.38, 'rgba(6, 8, 16, 0.65)');
      grad.addColorStop(0.72, 'rgba(8, 11, 20, 0.24)');
      grad.addColorStop(1.0, 'rgba(8, 11, 20, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    function createWaterGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 4, 128, 128, 124);
      grad.addColorStop(0.0, 'rgba(255, 215, 130, 0.62)');
      grad.addColorStop(0.28, 'rgba(255, 155, 55, 0.34)');
      grad.addColorStop(0.65, 'rgba(225, 105, 25, 0.10)');
      grad.addColorStop(1.0, 'rgba(180, 70, 10, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    function createStarSpriteTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 1, 32, 32, 30);
      grad.addColorStop(0.0, 'rgba(255, 252, 245, 1.0)');
      grad.addColorStop(0.3, 'rgba(235, 240, 255, 0.65)');
      grad.addColorStop(0.7, 'rgba(180, 200, 255, 0.15)');
      grad.addColorStop(1.0, 'rgba(150, 180, 255, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    const washiPaperTex = createWashiPaperTexture();
    const shojiScreenTex = createShojiScreenTexture();
    const alcoveBackdropTex = createAlcoveBackdropTexture();
    const contactShadowTex = createContactShadowTexture();
    const waterGlowTex = createWaterGlowTexture();
    const starSpriteTex = createStarSpriteTexture();

    const contactShadowGeo = new THREE.PlaneGeometry(1, 1);
    contactShadowGeo.rotateX(-Math.PI * 0.5);

    function addContactShadow(parent, x, y, z, radiusX, radiusZ, opacity = 0.75) {
      const mat = new THREE.MeshBasicMaterial({
        map: contactShadowTex,
        transparent: true,
        opacity,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -1,
        polygonOffsetUnits: -2
      });
      const disc = new THREE.Mesh(contactShadowGeo, mat);
      disc.position.set(x, y, z);
      disc.scale.set(radiusX * 2.0, 1, radiusZ * 2.0);
      parent.add(disc);
      return disc;
    }

    function addWaterLanternGlow(parent, x, y, z, radiusX, radiusZ, opacity = 0.55) {
      const mat = new THREE.MeshBasicMaterial({
        map: waterGlowTex,
        transparent: true,
        opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const disc = new THREE.Mesh(contactShadowGeo, mat);
      disc.position.set(x, y, z);
      disc.scale.set(radiusX * 2.0, 1, radiusZ * 2.0);
      parent.add(disc);
      return disc;
    }

    const materials = {
      vermilionTimber: new THREE.MeshStandardMaterial({
        color: 0xbf3624,
        roughness: 0.58,
        metalness: 0.06
      }),
      darkTimber: new THREE.MeshStandardMaterial({
        color: 0x281d19,
        roughness: 0.74,
        metalness: 0.05
      }),
      bridgeWood: new THREE.MeshStandardMaterial({
        color: 0x824c33,
        roughness: 0.68,
        metalness: 0.05
      }),
      cedarWood: new THREE.MeshStandardMaterial({
        color: 0x613f2a,
        roughness: 0.66,
        metalness: 0.05
      }),
      roofTile: new THREE.MeshStandardMaterial({
        color: 0x222733,
        roughness: 0.48,
        metalness: 0.22
      }),
      granite: new THREE.MeshStandardMaterial({
        color: 0x70747c,
        roughness: 0.80,
        metalness: 0.06
      }),
      wetStoneBase: new THREE.MeshStandardMaterial({
        color: 0x2b303a,
        roughness: 0.42,
        metalness: 0.12
      }),
      darkRock: new THREE.MeshStandardMaterial({
        color: 0x3a3f4a,
        roughness: 0.82,
        metalness: 0.06
      }),
      mossGround: new THREE.MeshStandardMaterial({
        color: 0x364b34,
        roughness: 0.86,
        metalness: 0.02
      }),
      brass: new THREE.MeshStandardMaterial({
        color: 0xd9ad52,
        emissive: 0x2e1c06,
        emissiveIntensity: 0.22,
        roughness: 0.26,
        metalness: 0.82
      }),
      sacredMirror: new THREE.MeshStandardMaterial({
        color: 0xffd884,
        emissive: 0x6b3e10,
        emissiveIntensity: 0.45,
        roughness: 0.14,
        metalness: 0.90
      }),
      shojiWarm: new THREE.MeshStandardMaterial({
        color: 0xffe4b5,
        map: shojiScreenTex,
        emissive: new THREE.Color(1.85, 0.88, 0.26),
        emissiveMap: shojiScreenTex,
        emissiveIntensity: 1.0,
        roughness: 0.52
      }),
      alcoveBackdrop: new THREE.MeshStandardMaterial({
        color: 0xffdea6,
        map: alcoveBackdropTex,
        emissive: new THREE.Color(1.55, 0.78, 0.22),
        emissiveMap: alcoveBackdropTex,
        emissiveIntensity: 1.0,
        roughness: 0.44
      }),
      lanternCore: new THREE.MeshStandardMaterial({
        color: 0xffebc2,
        map: washiPaperTex,
        emissive: new THREE.Color(2.35, 1.12, 0.34),
        emissiveMap: washiPaperTex,
        emissiveIntensity: 1.0,
        roughness: 0.36
      }),
      candleHeart: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: new THREE.Color(3.4, 1.85, 0.62),
        emissiveIntensity: 1.0,
        roughness: 0.15
      }),
      paperSleeve: new THREE.MeshStandardMaterial({
        color: 0xffe8ba,
        map: washiPaperTex,
        emissive: new THREE.Color(2.15, 1.02, 0.30),
        emissiveMap: washiPaperTex,
        emissiveIntensity: 1.0,
        roughness: 0.42
      }),
      mapleRed: new THREE.MeshStandardMaterial({
        color: 0xb02c22,
        roughness: 0.72,
        metalness: 0.03,
        flatShading: true
      }),
      mapleOrange: new THREE.MeshStandardMaterial({
        color: 0xd15826,
        roughness: 0.72,
        metalness: 0.03,
        flatShading: true
      }),
      mapleGold: new THREE.MeshStandardMaterial({
        color: 0xe0842c,
        roughness: 0.72,
        metalness: 0.03,
        flatShading: true
      }),
      trunkBark: new THREE.MeshStandardMaterial({
        color: 0x3e2d25,
        roughness: 0.82,
        metalness: 0.03
      })
    };

    // ============================================================================
    // 4. LIGHTING (PASS 1: Balanced Twilight Fill, Sky Rim & Warm Lantern Bounce)
    // ============================================================================
    const hemiLight = new THREE.HemisphereLight(0x6d85bd, 0x2c2333, 1.05);
    scene.add(hemiLight);

    // Warm low-angle dusk sun horizon directional light
    const duskSun = new THREE.DirectionalLight(0xff9e66, 1.15);
    duskSun.position.set(-24, 15, -32);
    duskSun.castShadow = true;
    duskSun.shadow.mapSize.set(2048, 2048);
    duskSun.shadow.camera.near = 2;
    duskSun.shadow.camera.far = 95;
    const d = 28;
    duskSun.shadow.camera.left = -d;
    duskSun.shadow.camera.right = d;
    duskSun.shadow.camera.top = d;
    duskSun.shadow.camera.bottom = -d;
    duskSun.shadow.bias = -0.0004;

    fillLight.position.set(18, 16, 24);

    // ============================================================================
    // 5. ENVIRONMENT: MULTI-STOP TWILIGHT SKY, STARS, PMREM IBL & DISPLACED RIDGES
    // ============================================================================
    function buildSkyDomeGeometry(radius, widthSegs, heightSegs) {
      const skyGeo = new THREE.SphereGeometry(radius, widthSegs, heightSegs);
      const posAttr = skyGeo.attributes.position;
      const colors = [];

      const zenithColor = new THREE.Color(0x0a0f1f);
      const upperMidColor = new THREE.Color(0x182342);
      const lowerMidColor = new THREE.Color(0x3f2e54);
      const duskBandColor = new THREE.Color(0x8c484e);
      const horizonColor = new THREE.Color(0xd97845);
      const sunGlowColor = new THREE.Color(0xf49b56);
      const c = new THREE.Color();

      for (let i = 0; i < posAttr.count; i++) {
        const vx = posAttr.getX(i);
        const vy = posAttr.getY(i);
        const vz = posAttr.getZ(i);
        const yNorm = Math.max(0, vy / radius);

        if (yNorm < 0.07) {
          c.lerpColors(horizonColor, duskBandColor, yNorm / 0.07);
        } else if (yNorm < 0.19) {
          c.lerpColors(duskBandColor, lowerMidColor, (yNorm - 0.07) / 0.12);
        } else if (yNorm < 0.46) {
          c.lerpColors(lowerMidColor, upperMidColor, (yNorm - 0.19) / 0.27);
        } else {
          c.lerpColors(upperMidColor, zenithColor, Math.min(1, (yNorm - 0.46) / 0.54));
        }

        // Subtle solar-azimuth afterglow concentration toward the northern/northwestern horizon (-Z, -X)
        const horizLen = Math.hypot(vx, vz) || 1;
        const nx = vx / horizLen;
        const nz = vz / horizLen;
        const sunAlign = Math.max(0, (-nz * 0.88 - nx * 0.47));
        const horizonFactor = Math.pow(Math.max(0, 1.0 - yNorm * 3.2), 1.8);
        const afterglow = Math.pow(sunAlign, 2.2) * horizonFactor * 0.48;
        if (afterglow > 0.001) {
          c.lerp(sunGlowColor, afterglow);
        }

        colors.push(c.r, c.g, c.b);
      }

      skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      return skyGeo;
    }

    function createMountainRidgeLayer(config) {
      const {
        radius,
        arcAngle,
        centerAngle,
        widthSegs,
        heightSegs,
        baseHeight,
        amp,
        seed,
        peakColorHex,
        midColorHex,
        hazeColorHex
      } = config;

      const geo = new THREE.BufferGeometry();
      const positions = [];
      const colors = [];
      const indices = [];

      const peakCol = new THREE.Color(peakColorHex);
      const midCol = new THREE.Color(midColorHex);
      const hazeCol = new THREE.Color(hazeColorHex);
      const tmpCol = new THREE.Color();

      for (let ix = 0; ix <= widthSegs; ix++) {
        const u = ix / widthSegs;
        const theta = centerAngle + (u - 0.5) * arcAngle;

        // Taper mountain elevation smoothly at the extreme ends of the arc
        const edgeEnvelope = Math.sin(u * Math.PI);
        const edgeSmooth = Math.pow(edgeEnvelope, 0.55);

        // Multi-octave ridge displacement (ridged multifractal style silhouette)
        const a1 = theta * 3.0 + seed * 1.7;
        const a2 = theta * 7.0 - seed * 2.3;
        const a3 = theta * 15.0 + seed * 4.1;
        const a4 = theta * 29.0 - seed * 6.7;

        const r1 = 1.0 - Math.abs(Math.sin(a1));
        const r2 = 1.0 - Math.abs(Math.sin(a2));
        const r3 = 1.0 - Math.abs(Math.cos(a3));
        const r4 = Math.sin(a4) * 0.5 + 0.5;

        // Keep a subtle dip near the central torii/sanctuary axis (theta ~ -PI/2) so the shrine roof silhouette reads clearly
        const centerAxisDist = Math.abs(theta - (-Math.PI * 0.5));
        const shrineValleyMod = 0.78 + 0.22 * Math.min(1.0, centerAxisDist / 0.32);

        const ridgeElev =
          (baseHeight +
            amp * (r1 * 0.52 + r2 * 0.28 + r3 * 0.14 + r4 * 0.06)) *
          edgeSmooth *
          shrineValleyMod;

        for (let iy = 0; iy <= heightSegs; iy++) {
          const v = iy / heightSegs; // 0 = base below water, 1 = ridge crest
          const radialOffset = radius - (1.0 - v) * 8.5 + Math.sin(theta * 9.0 + v * 2.0) * 1.4;
          const x = Math.cos(theta) * radialOffset;
          const z = Math.sin(theta) * radialOffset;
          const y = -0.8 + v * (ridgeElev + 0.8);

          positions.push(x, y, z);

          // Atmospheric twilight haze blending from base up to crest
          const hNorm = Math.max(0, Math.min(1, y / (baseHeight + amp)));
          if (hNorm < 0.35) {
            tmpCol.lerpColors(hazeCol, midCol, hNorm / 0.35);
          } else {
            tmpCol.lerpColors(midCol, peakCol, (hNorm - 0.35) / 0.65);
          }
          colors.push(tmpCol.r, tmpCol.g, tmpCol.b);
        }
      }

      const stride = heightSegs + 1;
      for (let ix = 0; ix < widthSegs; ix++) {
        for (let iy = 0; iy < heightSegs; iy++) {
          const a = ix * stride + iy;
          const b = (ix + 1) * stride + iy;
          const c = (ix + 1) * stride + (iy + 1);
          const d = ix * stride + (iy + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      geo.setIndex(indices);
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.92,
        metalness: 0.02,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
      return mesh;
    }

    function createEnvironment() {
      // 1. Multi-stop twilight sky dome
      const skyGeo = buildSkyDomeGeometry(148, 64, 44);
      const skyMat = new THREE.MeshBasicMaterial({
        vertexColors: true,
        side: THREE.BackSide,
        fog: false
      });
      const skyMesh = new THREE.Mesh(skyGeo, skyMat);
      scene.add(skyMesh);

      // 2. Generate PMREM twilight environment map so water, brass, and stone reflect twilight sky
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      const envSkyMesh = new THREE.Mesh(
        buildSkyDomeGeometry(60, 32, 24),
        new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })
      );
      envScene.add(envSkyMesh);
      const envMapRT = pmremGenerator.fromScene(envScene, 0.035);
      scene.environment = envMapRT.texture;
      scene.environmentIntensity = 0.85;
      pmremGenerator.dispose();

      // 3. Pinpoint twilight stars in the upper sky dome
      const starRng = seededRandom(707);
      const starCount = 320;
      const starPositions = [];
      const starColors = [];
      const sCol = new THREE.Color();

      for (let i = 0; i < starCount; i++) {
        const u = starRng();
        const v = 0.22 + starRng() * 0.76; // Keep stars above the low horizon haze
        const theta = u * Math.PI * 2;
        const phi = Math.acos(v);
        const r = 142;

        const sx = r * Math.sin(phi) * Math.cos(theta);
        const sy = r * Math.cos(phi);
        const sz = r * Math.sin(phi) * Math.sin(theta);
        starPositions.push(sx, sy, sz);

        // Fade stars near lower twilight transition, brighter toward zenith
        const altitudeFade = Math.pow((v - 0.20) / 0.80, 1.35);
        const twinkleBase = 0.45 + starRng() * 0.55;
        const lum = altitudeFade * twinkleBase;

        if (starRng() > 0.72) {
          sCol.setRGB(lum * 1.0, lum * 0.92, lum * 0.78); // Warm gold-white star
        } else {
          sCol.setRGB(lum * 0.86, lum * 0.93, lum * 1.0); // Cool blue-white twilight star
        }
        starColors.push(sCol.r, sCol.g, sCol.b);
      }

      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
      starGeo.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
      const starMat = new THREE.PointsMaterial({
        size: 1.35,
        map: starSpriteTex,
        vertexColors: true,
        transparent: true,
        opacity: 0.92,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false
      });
      const starField = new THREE.Points(starGeo, starMat);
      scene.add(starField);

      // 4. Shallow dark cove seabed below water
      const bedGeo = new THREE.PlaneGeometry(210, 210);
      bedGeo.rotateX(-Math.PI / 2);
      const bedMat = new THREE.MeshStandardMaterial({
        color: 0x0b101b,
        roughness: 0.96
      });
      const bedMesh = new THREE.Mesh(bedGeo, bedMat);
      bedMesh.position.y = -0.45;
      scene.add(bedMesh);

      // 5. Pass 1 Calibrated Twilight Water Surface (receiveShadow = false to eliminate hard shadow stripes & orange blob)
      const waterGeo = new THREE.PlaneGeometry(210, 210, 64, 64);
      waterGeo.rotateX(-Math.PI / 2);
      const waterMat = new THREE.MeshStandardMaterial({
        color: 0x132033,
        roughness: 0.14,
        metalness: 0.82,
        envMapIntensity: 1.15,
        transparent: true,
        opacity: 0.93
      });
      const waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.position.y = 0.0;
      waterMesh.receiveShadow = false;
      scene.add(waterMesh);

      // 6. Multi-Layered Displaced Mountain Ridge Silhouettes (z ~ -55, -75, -95)
      // Layer 1: Near cove mountain ridges (z ~ -55)
      createMountainRidgeLayer({
        radius: 56,
        arcAngle: Math.PI * 1.32,
        centerAngle: -Math.PI * 0.5,
        widthSegs: 160,
        heightSegs: 18,
        baseHeight: 4.5,
        amp: 9.8,
        seed: 1.2,
        peakColorHex: 0x141b2e,
        midColorHex: 0x1d243b,
        hazeColorHex: 0x3b3148
      });

      // Layer 2: Mid-distance mountain range (z ~ -75)
      createMountainRidgeLayer({
        radius: 76,
        arcAngle: Math.PI * 1.45,
        centerAngle: -Math.PI * 0.5,
        widthSegs: 180,
        heightSegs: 18,
        baseHeight: 7.2,
        amp: 13.5,
        seed: 3.7,
        peakColorHex: 0x1a2238,
        midColorHex: 0x262c46,
        hazeColorHex: 0x4c374c
      });

      // Layer 3: Far alpine twilight horizon range (z ~ -95)
      createMountainRidgeLayer({
        radius: 96,
        arcAngle: Math.PI * 1.55,
        centerAngle: -Math.PI * 0.5,
        widthSegs: 180,
        heightSegs: 18,
        baseHeight: 10.5,
        amp: 17.5,
        seed: 7.4,
        peakColorHex: 0x212942,
        midColorHex: 0x32334f,
        hazeColorHex: 0x61404e
      });
    }

    // ============================================================================
    // 7. ARCHED WOODEN BRIDGE (TAIKOBASHI) (-4.5, 14.0 -> -1.5, 4.0)
    // ============================================================================
    function createArchedBridge() {
      const bridgeGroup = new THREE.Group();
      const start = new THREE.Vector3(-5.8, 0.15, 13.8);
      const end = new THREE.Vector3(-3.3, 0.15, 4.2);
      const dir = new THREE.Vector3().subVectors(end, start);
      const length = dir.length();
      const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
      const angleY = Math.atan2(dir.x, dir.z);

      bridgeGroup.position.set(mid.x, 0, mid.z);
      bridgeGroup.rotation.y = angleY;

      const bridgeWidth = 2.1;
      const archHeight = 1.35;
      const segments = 26;

      // Arched deck planks & side stringer beams
      for (let i = 0; i <= segments; i++) {
        const u = i / segments; // 0 to 1
        const localZ = (u - 0.5) * length;
        const archY = Math.sin(u * Math.PI) * archHeight + 0.22;
        const slopeAngle = Math.atan(
          (Math.cos(u * Math.PI) * Math.PI * archHeight) / length
        );

        // Deck plank
        const plank = new THREE.Mesh(
          new THREE.BoxGeometry(bridgeWidth, 0.08, (length / segments) * 0.92),
          materials.bridgeWood
        );
        plank.position.set(0, archY, localZ);
        plank.rotation.x = -slopeAngle;
        plank.castShadow = true;
        plank.receiveShadow = true;
        bridgeGroup.add(plank);

        // Under-stringer segments on left & right
        [-1, 1].forEach((side) => {
          const stringer = new THREE.Mesh(
            new THREE.BoxGeometry(0.14, 0.18, (length / segments) * 1.06),
            materials.vermilionTimber
          );
            stringer.position.set(side * (bridgeWidth * 0.46), archY - 0.09, localZ);
            stringer.rotation.x = -slopeAngle;
            stringer.castShadow = true;
            bridgeGroup.add(stringer);
        });
      }

      // Bridge Posts (oyabashira) & brass finials (giboshi) + top/middle rails
      const postCount = 6;
      for (let i = 0; i <= postCount; i++) {
        const u = i / postCount;
        const localZ = (u - 0.5) * length;
        const archY = Math.sin(u * Math.PI) * archHeight + 0.22;

        [-1, 1].forEach((side) => {
          const rx = side * (bridgeWidth * 0.46);
          const post = new THREE.Mesh(
            new THREE.CylinderGeometry(0.065, 0.07, 0.78, 10),
            materials.vermilionTimber
          );
          post.position.set(rx, archY + 0.38, localZ);
          post.castShadow = true;
          bridgeGroup.add(post);

          // Brass giboshi cap
          const giboshiBase = new THREE.Mesh(
            new THREE.CylinderGeometry(0.075, 0.075, 0.08, 10),
            materials.brass
          );
          giboshiBase.position.set(rx, archY + 0.80, localZ);
          bridgeGroup.add(giboshiBase);

          const giboshiTop = new THREE.Mesh(
            new THREE.ConeGeometry(0.072, 0.14, 10),
            materials.brass
          );
          giboshiTop.position.set(rx, archY + 0.91, localZ);
          bridgeGroup.add(giboshiTop);

          // Support pilings into water at inner posts
          if (i > 0 && i < postCount) {
            const piling = new THREE.Mesh(
              new THREE.CylinderGeometry(0.09, 0.11, archY + 0.5, 10),
              materials.darkTimber
            );
            piling.position.set(side * (bridgeWidth * 0.38), (archY - 0.3) * 0.5, localZ);
            piling.castShadow = true;
            bridgeGroup.add(piling);
          }
        });

        // Connect rails to next post
        if (i < postCount) {
          const uNext = (i + 1) / postCount;
          const zNext = (uNext - 0.5) * length;
          const yNext = Math.sin(uNext * Math.PI) * archHeight + 0.22;
          const segDz = zNext - localZ;
          const segDy = yNext - archY;
          const segLen = Math.hypot(segDz, segDy);
          const segSlope = Math.atan2(segDy, segDz);

          [-1, 1].forEach((side) => {
            const rx = side * (bridgeWidth * 0.46);
            // Top handrail (kōran)
            const topRail = new THREE.Mesh(
              new THREE.BoxGeometry(0.09, 0.08, segLen + 0.04),
              materials.vermilionTimber
            );
            topRail.position.set(rx, (archY + yNext) * 0.5 + 0.68, (localZ + zNext) * 0.5);
            topRail.rotation.x = -segSlope;
            topRail.castShadow = true;
            bridgeGroup.add(topRail);

            // Mid rail
            const midRail = new THREE.Mesh(
              new THREE.BoxGeometry(0.06, 0.05, segLen + 0.02),
              materials.bridgeWood
            );
            midRail.position.set(rx, (archY + yNext) * 0.5 + 0.38, (localZ + zNext) * 0.5);
            midRail.rotation.x = -segSlope;
            bridgeGroup.add(midRail);
          });
        }
      }

      // Stone abutment pads at both ends of the bridge
      [-0.5, 0.5].forEach((endFactor) => {
        const abutment = new THREE.Mesh(
          new THREE.BoxGeometry(bridgeWidth + 0.5, 0.45, 0.9),
          materials.granite
        );
        abutment.position.set(0, 0.08, endFactor * length);
        abutment.receiveShadow = true;
        bridgeGroup.add(abutment);
      });

      scene.add(bridgeGroup);
      return bridgeGroup;
    }

    // ============================================================================

    function createSanctuaryPavilion() {
      const sanctuary = new THREE.Group();

      const islandMound = new THREE.Mesh(

      // Front Stone Stairway descending to the water channel (facing +Z)

      // 2. Veranda Floor (engawa) at y = 1.18

      [-4.25, 4.25].forEach((sideX) => {

      // 3. Main Timber Hall Columns & Glowing Shoji Screens

      // Upper ridge beam (mune) & golden end caps

      [-2.82, 2.82].forEach((rx) => {

      // Crossed roof finials (chigi) & horizontal billets (katsuogi)

    // ============================================================================
    // 10. ROCKY ISLAND MOUNDS & JAPANESE MAPLE TREES (MOMIJI)
    // ============================================================================
    function createShoreIsland(x, z, radiusX, radiusZ, height = 0.48) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);

      const rockBase = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusX * 0.82, radiusX, height, 10),
        materials.darkRock
      );
      rockBase.position.y = height * 0.35;
      rockBase.scale.set(1, 1, radiusZ / radiusX);
      rockBase.castShadow = true;
      rockBase.receiveShadow = true;
      group.add(rockBase);

      const mossCap = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusX * 0.72, radiusX * 0.82, height * 0.38, 10),
        materials.mossGround
      );
      mossCap.position.y = height * 0.72;
      mossCap.scale.set(1, 1, radiusZ / radiusX);
      mossCap.receiveShadow = true;
      group.add(mossCap);

      scene.add(group);
      return group;
    }

    function createMapleTree(x, y, z, scale = 1.0, seed = 1) {
      const tree = new THREE.Group();
      tree.position.set(x, y, z);
      tree.scale.setScalar(scale);

      // Gnarled trunk + primary limbs
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.14, 0.26, 2.2, 8),
        materials.trunkBark
      );
      trunk.position.set(0, 1.05, 0);
      trunk.rotation.z = ((seed % 3) - 1) * 0.08;
      trunk.castShadow = true;
      tree.add(trunk);

      const branchConfigs = [
        { dx: -0.65, dy: 2.15, dz: 0.35, rx: 0.25, rz: 0.52, r: 1.15, mat: materials.mapleRed },
        { dx: 0.72, dy: 2.35, dz: -0.25, rx: -0.2, rz: -0.48, r: 1.22, mat: materials.mapleOrange },
        { dx: 0.05, dy: 2.85, dz: 0.1, rx: 0.1, rz: 0.08, r: 1.32, mat: materials.mapleRed },
        { dx: -0.35, dy: 2.55, dz: -0.62, rx: -0.38, rz: 0.28, r: 1.05, mat: materials.mapleGold },
        { dx: 0.55, dy: 1.95, dz: 0.58, rx: 0.35, rz: -0.35, r: 0.95, mat: materials.mapleOrange }
      ];

      branchConfigs.forEach((b) => {
        // Branch limb
        const limb = new THREE.Mesh(
          new THREE.CylinderGeometry(0.06, 0.11, 1.35, 6),
          materials.trunkBark
        );
        limb.position.set(b.dx * 0.55, b.dy - 0.45, b.dz * 0.55);
        limb.rotation.set(b.rx, 0, b.rz);
        limb.castShadow = true;
        tree.add(limb);

        // Baseline geometric foliage cluster (icosahedron/dodecahedron)
        const canopyGeo = new THREE.IcosahedronGeometry(b.r, 1);
        const canopy = new THREE.Mesh(canopyGeo, b.mat);
        canopy.position.set(b.dx, b.dy, b.dz);
        canopy.scale.set(1.25, 0.62, 1.15);
        canopy.castShadow = true;
        canopy.receiveShadow = true;
        tree.add(canopy);
      });

      scene.add(tree);
      return tree;
    }

    // Stepped Stone Lanterns (Tōrō)

    // ============================================================================
    // 13. DETERMINISTIC TIME, CAMERA API & 6-DOF WASD CONTROLS
    // ============================================================================
    let deterministicTime = urlParams.has('t') ? parseFloat(urlParams.get('t')) : null;
    let activePresetName = 'overview';

    function updateSceneAtTime(t) {
      for (let i = 0; i < floatingLanterns.length; i++) {
        const item = floatingLanterns[i];
        const wave = t * 0.85 + item.phase;
        item.group.position.x = item.baseX + Math.sin(wave * 0.7) * 0.08;
        item.group.position.z = item.baseZ + Math.cos(wave * 0.55) * 0.08;
        item.group.position.y = 0.02 + Math.sin(wave * 1.4) * 0.012;
        item.group.rotation.y = Math.sin(wave * 0.4) * 0.18;
      }
    }

    function updateCameraUI(presetName) {
      const links = document.querySelectorAll('.camera-link');
      links.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.preset === presetName);
      });
    }

    window.__SET_CAMERA_PRESET__ = function (name) {
      const preset = CAMERA_PRESETS[name] || CAMERA_PRESETS.overview;
      activePresetName = CAMERA_PRESETS[name] ? name : 'overview';
      camera.position.set(preset.position[0], preset.position[1], preset.position[2]);
      camera.fov = preset.fov;
      camera.updateProjectionMatrix();
      controls.target.set(preset.target[0], preset.target[1], preset.target[2]);
      controls.update();
      updateCameraUI(activePresetName);
      renderer.render(scene, camera);
      return {
        preset: activePresetName,
        position: [...preset.position],
        target: [...preset.target],
        fov: preset.fov
      };
    };

    window.__GET_CAMERA_STATE__ = function () {
      return {
        preset: activePresetName,
        position: [camera.position.x, camera.position.y, camera.position.z],
        target: [controls.target.x, controls.target.y, controls.target.z],
        fov: camera.fov
      };
    };

    window.__SET_CAMERA_STATE__ = function (state) {
      if (!state) return window.__GET_CAMERA_STATE__();
      if (Array.isArray(state.position) && state.position.length === 3) {
        camera.position.set(state.position[0], state.position[1], state.position[2]);
      }
      if (typeof state.fov === 'number') {
        camera.fov = state.fov;
        camera.updateProjectionMatrix();
      }
      if (Array.isArray(state.target) && state.target.length === 3) {
        controls.target.set(state.target[0], state.target[1], state.target[2]);
      }
      controls.update();
      renderer.render(scene, camera);
      return window.__GET_CAMERA_STATE__();
    };

    window.__SET_DETERMINISTIC_TIME__ = function (t) {
      deterministicTime = typeof t === 'number' && !Number.isNaN(t) ? t : null;
      const effectiveT = deterministicTime !== null ? deterministicTime : performance.now() * 0.001;
      updateSceneAtTime(effectiveT);
      renderer.render(scene, camera);
      return deterministicTime;
    };

    window.__SET_HUD_VISIBLE__ = function (visible) {
      document.body.classList.toggle('chromeless', !visible);
      return visible;
    };

    // Populate HUD camera viewpoint buttons
    const cameraLinksContainer = document.getElementById('camera-links');
    Object.entries(CAMERA_PRESETS).forEach(([key, preset]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'camera-link';
      btn.dataset.preset = key;
      btn.textContent = preset.label;
      btn.addEventListener('click', () => {
        window.__SET_CAMERA_PRESET__(key);
      });
      cameraLinksContainer.appendChild(btn);
    });

    // Apply initial preset from URL or default to 'overview'
    const initialPreset = urlParams.get('preset') || 'overview';
    window.__SET_CAMERA_PRESET__(initialPreset);
    if (deterministicTime !== null) {
      window.__SET_DETERMINISTIC_TIME__(deterministicTime);
    }

    // 6-DoF WASD + E/Q Keyboard Navigation
    const pressedKeys = new Set();
    window.addEventListener('keydown', (e) => {
      pressedKeys.add(e.code);
    });
    window.addEventListener('keyup', (e) => {
      pressedKeys.delete(e.code);
    });
    window.addEventListener('blur', () => {
      pressedKeys.clear();
    });

    const moveForward = new THREE.Vector3();
    const moveRight = new THREE.Vector3();
    const moveDelta = new THREE.Vector3();
    const worldUp = new THREE.Vector3(0, 1, 0);

    function applyKeyboardNavigation(dt) {
      if (pressedKeys.size === 0) return;
      const speed = 7.5 * dt;
      moveDelta.set(0, 0, 0);

      camera.getWorldDirection(moveForward);
      moveForward.y = 0;
      if (moveForward.lengthSq() > 1e-6) {
        moveForward.normalize();
      } else {
        moveForward.set(0, 0, -1);
      }
      moveRight.crossVectors(moveForward, worldUp).normalize();

      if (pressedKeys.has('KeyW') || pressedKeys.has('ArrowUp')) {
        moveDelta.addScaledVector(moveForward, speed);
      }
      if (pressedKeys.has('KeyS') || pressedKeys.has('ArrowDown')) {
        moveDelta.addScaledVector(moveForward, -speed);
      }
      if (pressedKeys.has('KeyD') || pressedKeys.has('ArrowRight')) {
        moveDelta.addScaledVector(moveRight, speed);
      }
      if (pressedKeys.has('KeyA') || pressedKeys.has('ArrowLeft')) {
        moveDelta.addScaledVector(moveRight, -speed);
      }
      if (pressedKeys.has('KeyE') || pressedKeys.has('Space')) {
        moveDelta.y += speed;
      }
      if (pressedKeys.has('KeyQ') || pressedKeys.has('ShiftLeft')) {
        moveDelta.y -= speed;
      }

      if (moveDelta.lengthSq() > 0) {
        camera.position.add(moveDelta);
        controls.target.add(moveDelta);
        // Keep camera slightly above water surface
        if (camera.position.y < 0.25) {
          const lift = 0.25 - camera.position.y;
          camera.position.y += lift;
          controls.target.y += lift;
        }
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Main Render Loop
    let lastFrameTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastFrameTime) * 0.001, 0.1);
      lastFrameTime = now;

      applyKeyboardNavigation(dt);
      controls.update();

      const t = deterministicTime !== null ? deterministicTime : now * 0.001;
      updateSceneAtTime(t);

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
