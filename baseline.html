<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Japanese Lantern Sanctuary at Dusk — Baseline</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --ink: #f0ece1;
      --ink-muted: rgba(240, 236, 225, 0.68);
      --ink-Subtle: rgba(240, 236, 225, 0.42);
      --rule: rgba(240, 236, 225, 0.22);
      --accent: #e89b54;
      --surface: rgba(15, 19, 29, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141a29;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 36px 48px;
      z-index: 10;
      background:
        linear-gradient(180deg, rgba(10, 14, 24, 0.58) 0%, rgba(10, 14, 24, 0) 24%, rgba(10, 14, 24, 0) 76%, rgba(10, 14, 24, 0.68) 100%);
    }

    body.chromeless #hud {
      display: none !important;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 32px;
    }

    .hud-header {
      max-width: 580px;
      text-shadow: 0 1px 12px rgba(5, 8, 15, 0.85);
    }

    .hud-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(26px, 2.6vw, 34px);
      font-weight: 400;
      letter-spacing: -0.015em;
      line-height: 1.18;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .hud-subtitle {
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink-muted);
    }

    .hud-page-links {
      pointer-events: auto;
      display: flex;
      gap: 24px;
      padding-top: 6px;
      text-shadow: 0 1px 10px rgba(5, 8, 15, 0.85);
    }

    .hud-page-link {
      font-size: 14px;
      color: var(--ink-muted);
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: var(--rule);
      transition: color 0.15s ease, text-decoration-color 0.15s ease;
    }

    .hud-page-link:hover {
      color: var(--ink);
      text-decoration-color: var(--ink);
    }

    .hud-footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 32px;
      flex-wrap: wrap;
      border-top: 1px solid var(--rule);
      padding-top: 16px;
      text-shadow: 0 1px 10px rgba(5, 8, 15, 0.85);
    }

    .camera-nav {
      pointer-events: auto;
      display: flex;
      align-items: baseline;
      gap: 24px;
      flex-wrap: wrap;
    }

    .camera-nav-label {
      font-size: 13px;
      color: var(--ink-Subtle);
    }

    .camera-nav-links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    .camera-link {
      appearance: none;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 4px 0;
      font-family: inherit;
      font-size: 15px;
      color: var(--ink-muted);
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .camera-link:hover {
      color: var(--ink);
      border-bottom-color: var(--rule);
    }

    .camera-link.active {
      color: var(--ink);
      border-bottom-color: var(--ink);
      font-weight: 500;
    }

    .controls-hint {
      font-size: 13px;
      color: var(--ink-muted);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div class="hud-top">
      <header class="hud-header">
        <h1 class="hud-title">Floating Japanese Lantern Sanctuary at Dusk (Baseline)</h1>
        <p class="hud-subtitle">Round 0 baseline scene using standard geometry, flat lighting, and basic materials before the four upgrade passes.</p>
      </header>
      <nav class="hud-page-links" aria-label="Scene versions">
        <a class="hud-page-link" href="comparison.html">Compare baseline and final scene</a>
        <a class="hud-page-link" href="index.html">View final scene</a>
      </nav>
    </div>

    <footer class="hud-footer">
      <nav class="camera-nav" aria-label="Camera views">
        <span class="camera-nav-label">Camera view</span>
        <div class="camera-nav-links" id="camera-links"></div>
      </nav>
      <div class="controls-hint">
        Drag to look around. Use W, A, S, D, E and Q to move.
      </div>
    </footer>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================================
    // 1. CANONICAL CAMERA PRESETS
    // ============================================================================
    const CAMERA_PRESETS = {
      overview: {
        position: [0, 7.5, 24],
        target: [0, 2.2, -2],
        fov: 45,
        label: 'Overview'
      },
      bridge: {
        position: [-5.5, 3.4, 11.5],
        target: [1.5, 2.4, -3.5],
        fov: 42,
        label: 'Arched bridge'
      },
      lantern_closeup: {
        position: [3.2, 1.85, 5.8],
        target: [1.8, 1.4, 2.2],
        fov: 38,
        label: 'Lantern close-up'
      },
      water_grazing: {
        position: [-2.8, 0.55, 8.5],
        target: [0.5, 1.6, -6.0],
        fov: 40,
        label: 'Water grazing'
      },
      sanctuary_interior: {
        position: [0.0, 2.8, -5.5],
        target: [0.0, 2.5, -16.5],
        fov: 46,
        label: 'Sanctuary interior'
      }
    };

    window.__CAMERA_PRESETS__ = CAMERA_PRESETS;

    // URL Parameters
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('chromeless') === '1') {
      document.body.classList.add('chromeless');
    }

    // ============================================================================
    // 2. SCENE, RENDERER, CAMERA & CONTROLS
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // Round 0 Baseline uses basic LinearToneMapping at exposure 1.0
    renderer.toneMapping = THREE.LinearToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b2236);
    scene.fog = new THREE.Fog(0x1b2236, 18, 95);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      250
    );

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxDistance = 85;
    controls.minDistance = 0.5;
    controls.maxPolarAngle = Math.PI * 0.495;

    // ============================================================================
    // 3. BASELINE MATERIALS (Flat Standard Materials - No Procedural Maps Yet)
    // ============================================================================
    const materials = {
      vermilionTimber: new THREE.MeshStandardMaterial({
        color: 0xb83322,
        roughness: 0.65,
        metalness: 0.05
      }),
      darkTimber: new THREE.MeshStandardMaterial({
        color: 0x2a1f1b,
        roughness: 0.78,
        metalness: 0.05
      }),
      bridgeWood: new THREE.MeshStandardMaterial({
        color: 0x7c4830,
        roughness: 0.72,
        metalness: 0.04
      }),
      cedarWood: new THREE.MeshStandardMaterial({
        color: 0x5c3c28,
        roughness: 0.7,
        metalness: 0.04
      }),
      roofTile: new THREE.MeshStandardMaterial({
        color: 0x242832,
        roughness: 0.6,
        metalness: 0.15
      }),
      granite: new THREE.MeshStandardMaterial({
        color: 0x6a6d72,
        roughness: 0.85,
        metalness: 0.05
      }),
      darkRock: new THREE.MeshStandardMaterial({
        color: 0x3b3f48,
        roughness: 0.88,
        metalness: 0.04
      }),
      mossGround: new THREE.MeshStandardMaterial({
        color: 0x354832,
        roughness: 0.9,
        metalness: 0.02
      }),
      brass: new THREE.MeshStandardMaterial({
        color: 0xc89e46,
        roughness: 0.35,
        metalness: 0.75
      }),
      shojiWarm: new THREE.MeshStandardMaterial({
        color: 0xffd796,
        emissive: 0xff9d3b,
        emissiveIntensity: 0.75,
        roughness: 0.5
      }),
      lanternCore: new THREE.MeshStandardMaterial({
        color: 0xffe4a8,
        emissive: 0xff9828,
        emissiveIntensity: 1.2,
        roughness: 0.3
      }),
      paperSleeve: new THREE.MeshStandardMaterial({
        color: 0xffdf9e,
        emissive: 0xff8c24,
        emissiveIntensity: 0.95,
        roughness: 0.45
      }),
      mapleRed: new THREE.MeshStandardMaterial({
        color: 0xa82820,
        roughness: 0.78,
        metalness: 0.02,
        flatShading: true
      }),
      mapleOrange: new THREE.MeshStandardMaterial({
        color: 0xc95224,
        roughness: 0.78,
        metalness: 0.02,
        flatShading: true
      }),
      mapleGold: new THREE.MeshStandardMaterial({
        color: 0xd97d28,
        roughness: 0.78,
        metalness: 0.02,
        flatShading: true
      }),
      trunkBark: new THREE.MeshStandardMaterial({
        color: 0x3d2c24,
        roughness: 0.85,
        metalness: 0.02
      }),
      distantMountain: new THREE.MeshStandardMaterial({
        color: 0x181f32,
        roughness: 0.95,
        metalness: 0.0,
        flatShading: true
      })
    };

    // ============================================================================
    // 4. LIGHTING (Baseline Dusk Setup)
    // ============================================================================
    const hemiLight = new THREE.HemisphereLight(0x526594, 0x25222e, 0.85);
    scene.add(hemiLight);

    const duskSun = new THREE.DirectionalLight(0xff9c63, 1.45);
    duskSun.position.set(-22, 16, -28);
    duskSun.castShadow = true;
    duskSun.shadow.mapSize.set(1024, 1024);
    duskSun.shadow.camera.near = 2;
    duskSun.shadow.camera.far = 90;
    const d = 28;
    duskSun.shadow.camera.left = -d;
    duskSun.shadow.camera.right = d;
    duskSun.shadow.camera.top = d;
    duskSun.shadow.camera.bottom = -d;
    duskSun.shadow.bias = -0.0005;
    scene.add(duskSun);

    const fillLight = new THREE.DirectionalLight(0x6380b5, 0.45);
    fillLight.position.set(18, 12, 22);
    scene.add(fillLight);

    // ============================================================================
    // 5. ENVIRONMENT: DUSK HORIZON BACKDROP & WATER BASIN
    // ============================================================================
    function createEnvironment() {
      // Dusk sky dome (simple vertex-colored hemisphere)
      const skyGeo = new THREE.SphereGeometry(140, 32, 20);
      const posAttr = skyGeo.attributes.position;
      const colors = [];
      const zenithColor = new THREE.Color(0x121829);
      const midColor = new THREE.Color(0x27314f);
      const horizonColor = new THREE.Color(0x6e4850);
      const c = new THREE.Color();

      for (let i = 0; i < posAttr.count; i++) {
        const y = Math.max(0, posAttr.getY(i) / 140);
        if (y < 0.22) {
          c.lerpColors(horizonColor, midColor, y / 0.22);
        } else {
          c.lerpColors(midColor, zenithColor, (y - 0.22) / 0.78);
        }
        colors.push(c.r, c.g, c.b);
      }
      skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      const skyMat = new THREE.MeshBasicMaterial({
        vertexColors: true,
        side: THREE.BackSide,
        fog: false
      });
      const skyMesh = new THREE.Mesh(skyGeo, skyMat);
      scene.add(skyMesh);

      // Shallow seabed below water
      const bedGeo = new THREE.PlaneGeometry(180, 180);
      bedGeo.rotateX(-Math.PI / 2);
      const bedMat = new THREE.MeshStandardMaterial({
        color: 0x101622,
        roughness: 0.95
      });
      const bedMesh = new THREE.Mesh(bedGeo, bedMat);
      bedMesh.position.y = -0.45;
      scene.add(bedMesh);

      // Baseline water surface at y = 0.0 (Standard material for Round 0)
      const waterGeo = new THREE.PlaneGeometry(180, 180, 32, 32);
      waterGeo.rotateX(-Math.PI / 2);
      const waterMat = new THREE.MeshStandardMaterial({
        color: 0x1c2b3d,
        roughness: 0.16,
        metalness: 0.65,
        transparent: true,
        opacity: 0.92
      });
      const waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.position.y = 0.0;
      waterMesh.receiveShadow = true;
      scene.add(waterMesh);

      // Distant surrounding mountain silhouettes
      const ridgeConfigs = [
        { x: 0, z: -68, w: 95, h: 16, d: 24 },
        { x: -38, z: -55, w: 60, h: 14, d: 22 },
        { x: 42, z: -52, w: 64, h: 15, d: 22 },
        { x: -55, z: -18, w: 45, h: 11, d: 35 },
        { x: 55, z: -15, w: 45, h: 12, d: 35 }
      ];
      ridgeConfigs.forEach((rc) => {
        const coneGeo = new THREE.ConeGeometry(rc.w * 0.5, rc.h, 7);
        const ridge = new THREE.Mesh(coneGeo, materials.distantMountain);
        ridge.position.set(rc.x, rc.h * 0.45 - 0.5, rc.z);
        ridge.scale.set(1.2, 1.0, rc.d / (rc.w * 0.5));
        scene.add(ridge);
      });
    }

    // ============================================================================
    // 6. MAIN TIMBER TORII GATE (x = 0.0, z = -2.0)
    // ============================================================================
    function createToriiGate(x = 0, z = -2.0) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);

      const pillarSpan = 4.6;
      const pillarHeight = 5.4;
      const pillarRadiusBottom = 0.24;
      const pillarRadiusTop = 0.20;

      // Stone pedestals (kamebara) in shallow water
      [-1, 1].forEach((side) => {
        const px = side * (pillarSpan * 0.5);
        const baseStone = new THREE.Mesh(
          new THREE.CylinderGeometry(0.42, 0.52, 0.55, 12),
          materials.granite
        );
        baseStone.position.set(px, 0.15, 0);
        baseStone.castShadow = true;
        baseStone.receiveShadow = true;
        group.add(baseStone);

        // Dark collar sleeve (nemaki)
        const nemaki = new THREE.Mesh(
          new THREE.CylinderGeometry(0.26, 0.28, 0.65, 16),
          materials.darkTimber
        );
        nemaki.position.set(px, 0.55, 0);
        nemaki.castShadow = true;
        group.add(nemaki);

        // Main vermilion pillar (hashira)
        const hashira = new THREE.Mesh(
          new THREE.CylinderGeometry(pillarRadiusTop, pillarRadiusBottom, pillarHeight, 16),
          materials.vermilionTimber
        );
        hashira.position.set(px, pillarHeight * 0.5 + 0.2, 0);
        hashira.castShadow = true;
        hashira.receiveShadow = true;
        group.add(hashira);

        // Outrigger Stabilization Post (hikaebashira - Ryōbu style) front & back
        [-0.95, 0.95].forEach((zOff) => {
          const subPost = new THREE.Mesh(
            new THREE.CylinderGeometry(0.11, 0.13, 1.85, 12),
            materials.vermilionTimber
          );
          subPost.position.set(px, 0.95, zOff);
          subPost.castShadow = true;
          group.add(subPost);

          const subRoof = new THREE.Mesh(
            new THREE.BoxGeometry(0.36, 0.1, 2.3),
            materials.darkTimber
          );
          subRoof.position.set(px, 1.9, 0);
          group.add(subRoof);
        });
      });

      // Lower tie-beam (nuki)
      const nuki = new THREE.Mesh(
        new THREE.BoxGeometry(pillarSpan + 1.8, 0.28, 0.22),
        materials.vermilionTimber
      );
      nuki.position.set(0, 4.35, 0);
      nuki.castShadow = true;
      group.add(nuki);

      // Wedge blocks (kusabi)
      [-1, 1].forEach((side) => {
        const kusabi = new THREE.Mesh(
          new THREE.BoxGeometry(0.55, 0.34, 0.28),
          materials.darkTimber
        );
        kusabi.position.set(side * (pillarSpan * 0.5), 4.35, 0);
        group.add(kusabi);
      });

      // Secondary upper lintel (shimagi)
      const shimagi = new THREE.Mesh(
        new THREE.BoxGeometry(pillarSpan + 2.4, 0.26, 0.34),
        materials.vermilionTimber
      );
      shimagi.position.set(0, 5.42, 0);
      shimagi.castShadow = true;
      group.add(shimagi);

      // Top lintel cap (kasagi) with subtle upturned ends
      const kasagiCenter = new THREE.Mesh(
        new THREE.BoxGeometry(pillarSpan + 2.9, 0.24, 0.48),
        materials.darkTimber
      );
      kasagiCenter.position.set(0, 5.66, 0);
      kasagiCenter.castShadow = true;
      group.add(kasagiCenter);

      [-1, 1].forEach((side) => {
        const wing = new THREE.Mesh(
          new THREE.BoxGeometry(1.15, 0.22, 0.48),
          materials.darkTimber
        );
        wing.position.set(side * ((pillarSpan + 2.9) * 0.5 + 0.35), 5.73, 0);
        wing.rotation.z = side * 0.14;
        wing.castShadow = true;
        group.add(wing);
      });

      // Central strut & tablet (gakuzuka)
      const gakuzuka = new THREE.Mesh(
        new THREE.BoxGeometry(0.56, 0.95, 0.16),
        materials.darkTimber
      );
      gakuzuka.position.set(0, 4.88, 0);
      group.add(gakuzuka);

      const plaqueTrim = new THREE.Mesh(
        new THREE.BoxGeometry(0.42, 0.72, 0.19),
        materials.brass
      );
      plaqueTrim.position.set(0, 4.88, 0);
      group.add(plaqueTrim);

      // Hanging lantern beneath the center of the Torii
      const cord = new THREE.Mesh(
        new THREE.CylinderGeometry(0.015, 0.015, 0.45, 8),
        materials.darkTimber
      );
      cord.position.set(0, 4.02, 0);
      group.add(cord);

      const toriiLantern = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.14, 0.32, 8),
        materials.lanternCore
      );
      toriiLantern.position.set(0, 3.7, 0);
      group.add(toriiLantern);

      const toriiLight = new THREE.PointLight(0xff9a3c, 2.2, 9.0, 1.6);
      toriiLight.position.set(0, 3.55, 0);
      group.add(toriiLight);

      scene.add(group);
      return group;
    }

    // ============================================================================
    // 7. ARCHED WOODEN BRIDGE (TAIKOBASHI) (-4.5, 14.0 -> -1.5, 4.0)
    // ============================================================================
    function createArchedBridge() {
      const bridgeGroup = new THREE.Group();
      const start = new THREE.Vector3(-5.8, 0.15, 13.8);
      const end = new THREE.Vector3(-3.3, 0.15, 4.2);
      const dir = new THREE.Vector3().subVectors(end, start);
      const length = dir.length();
      const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
      const angleY = Math.atan2(dir.x, dir.z);

      bridgeGroup.position.set(mid.x, 0, mid.z);
      bridgeGroup.rotation.y = angleY;

      const bridgeWidth = 2.1;
      const archHeight = 1.35;
      const segments = 26;

      // Arched deck planks & side stringer beams
      for (let i = 0; i <= segments; i++) {
        const u = i / segments; // 0 to 1
        const localZ = (u - 0.5) * length;
        const archY = Math.sin(u * Math.PI) * archHeight + 0.22;
        const slopeAngle = Math.atan(
          (Math.cos(u * Math.PI) * Math.PI * archHeight) / length
        );

        // Deck plank
        const plank = new THREE.Mesh(
          new THREE.BoxGeometry(bridgeWidth, 0.08, (length / segments) * 0.92),
          materials.bridgeWood
        );
        plank.position.set(0, archY, localZ);
        plank.rotation.x = -slopeAngle;
        plank.castShadow = true;
        plank.receiveShadow = true;
        bridgeGroup.add(plank);

        // Under-stringer segments on left & right
        [-1, 1].forEach((side) => {
          const stringer = new THREE.Mesh(
            new THREE.BoxGeometry(0.14, 0.18, (length / segments) * 1.06),
            materials.vermilionTimber
          );
            stringer.position.set(side * (bridgeWidth * 0.46), archY - 0.09, localZ);
            stringer.rotation.x = -slopeAngle;
            stringer.castShadow = true;
            bridgeGroup.add(stringer);
        });
      }

      // Bridge Posts (oyabashira) & brass finials (giboshi) + top/middle rails
      const postCount = 6;
      for (let i = 0; i <= postCount; i++) {
        const u = i / postCount;
        const localZ = (u - 0.5) * length;
        const archY = Math.sin(u * Math.PI) * archHeight + 0.22;

        [-1, 1].forEach((side) => {
          const rx = side * (bridgeWidth * 0.46);
          const post = new THREE.Mesh(
            new THREE.CylinderGeometry(0.065, 0.07, 0.78, 10),
            materials.vermilionTimber
          );
          post.position.set(rx, archY + 0.38, localZ);
          post.castShadow = true;
          bridgeGroup.add(post);

          // Brass giboshi cap
          const giboshiBase = new THREE.Mesh(
            new THREE.CylinderGeometry(0.075, 0.075, 0.08, 10),
            materials.brass
          );
          giboshiBase.position.set(rx, archY + 0.80, localZ);
          bridgeGroup.add(giboshiBase);

          const giboshiTop = new THREE.Mesh(
            new THREE.ConeGeometry(0.072, 0.14, 10),
            materials.brass
          );
          giboshiTop.position.set(rx, archY + 0.91, localZ);
          bridgeGroup.add(giboshiTop);

          // Support pilings into water at inner posts
          if (i > 0 && i < postCount) {
            const piling = new THREE.Mesh(
              new THREE.CylinderGeometry(0.09, 0.11, archY + 0.5, 10),
              materials.darkTimber
            );
            piling.position.set(side * (bridgeWidth * 0.38), (archY - 0.3) * 0.5, localZ);
            piling.castShadow = true;
            bridgeGroup.add(piling);
          }
        });

        // Connect rails to next post
        if (i < postCount) {
          const uNext = (i + 1) / postCount;
          const zNext = (uNext - 0.5) * length;
          const yNext = Math.sin(uNext * Math.PI) * archHeight + 0.22;
          const segDz = zNext - localZ;
          const segDy = yNext - archY;
          const segLen = Math.hypot(segDz, segDy);
          const segSlope = Math.atan2(segDy, segDz);

          [-1, 1].forEach((side) => {
            const rx = side * (bridgeWidth * 0.46);
            // Top handrail (kōran)
            const topRail = new THREE.Mesh(
              new THREE.BoxGeometry(0.09, 0.08, segLen + 0.04),
              materials.vermilionTimber
            );
            topRail.position.set(rx, (archY + yNext) * 0.5 + 0.68, (localZ + zNext) * 0.5);
            topRail.rotation.x = -segSlope;
            topRail.castShadow = true;
            bridgeGroup.add(topRail);

            // Mid rail
            const midRail = new THREE.Mesh(
              new THREE.BoxGeometry(0.06, 0.05, segLen + 0.02),
              materials.bridgeWood
            );
            midRail.position.set(rx, (archY + yNext) * 0.5 + 0.38, (localZ + zNext) * 0.5);
            midRail.rotation.x = -segSlope;
            bridgeGroup.add(midRail);
          });
        }
      }

      // Stone abutment pads at both ends of the bridge
      [-0.5, 0.5].forEach((endFactor) => {
        const abutment = new THREE.Mesh(
          new THREE.BoxGeometry(bridgeWidth + 0.5, 0.45, 0.9),
          materials.granite
        );
        abutment.position.set(0, 0.08, endFactor * length);
        abutment.receiveShadow = true;
        bridgeGroup.add(abutment);
      });

      scene.add(bridgeGroup);
      return bridgeGroup;
    }

      );
      core.position.y = 1.43;

      // Stone corner mullions around firebox
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;

      );

      [-2.8, 8.2, 0.3],
      [1.8, 7.4, 1.5],
      [-1.2, -4.2, 2.2],
      [1.2, -4.8, 3.0],
      [-0.9, -7.8, 0.9],
      [0.95, -8.4, 1.8],
      [-0.6, -10.8, 2.7],
      [0.65, -11.2, 3.5]
    ];
    paperLanternCoords.forEach(([lx, lz, phase]) => {
      createFloatingPaperLantern(lx, lz, phase);
    });

    // Shared warm glow lights over floating paper lantern clusters
    const clusterLight1 = new THREE.PointLight(0xff9432, 1.6, 7.0, 1.6);
    clusterLight1.position.set(1.8, 0.55, 3.6);
    scene.add(clusterLight1);

    const clusterLight2 = new THREE.PointLight(0xff9432, 1.5, 7.0, 1.6);
    clusterLight2.position.set(-1.1, 0.55, 4.8);
    scene.add(clusterLight2);

    // ============================================================================
    // 13. DETERMINISTIC TIME, CAMERA API & 6-DOF WASD CONTROLS
    // ============================================================================
    let deterministicTime = urlParams.has('t') ? parseFloat(urlParams.get('t')) : null;
    let activePresetName = 'overview';

    function updateSceneAtTime(t) {
      for (let i = 0; i < floatingLanterns.length; i++) {
        const item = floatingLanterns[i];
        const wave = t * 0.85 + item.phase;
        item.group.position.x = item.baseX + Math.sin(wave * 0.7) * 0.08;
        item.group.position.z = item.baseZ + Math.cos(wave * 0.55) * 0.08;
        item.group.position.y = 0.02 + Math.sin(wave * 1.4) * 0.012;
        item.group.rotation.y = Math.sin(wave * 0.4) * 0.18;
      }
    }

    function updateCameraUI(presetName) {
      const links = document.querySelectorAll('.camera-link');
      links.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.preset === presetName);
      });
    }

    window.__SET_CAMERA_PRESET__ = function (name) {
      const preset = CAMERA_PRESETS[name] || CAMERA_PRESETS.overview;
      activePresetName = CAMERA_PRESETS[name] ? name : 'overview';
      camera.position.set(preset.position[0], preset.position[1], preset.position[2]);
      camera.fov = preset.fov;
      camera.updateProjectionMatrix();
      controls.target.set(preset.target[0], preset.target[1], preset.target[2]);
      controls.update();
      updateCameraUI(activePresetName);
      renderer.render(scene, camera);
      return {
        preset: activePresetName,
        position: [...preset.position],
        target: [...preset.target],
        fov: preset.fov
      };
    };

    window.__GET_CAMERA_STATE__ = function () {
      return {
        preset: activePresetName,
        position: [camera.position.x, camera.position.y, camera.position.z],
        target: [controls.target.x, controls.target.y, controls.target.z],
        fov: camera.fov
      };
    };

    window.__SET_CAMERA_STATE__ = function (state) {
      if (!state) return window.__GET_CAMERA_STATE__();
      if (Array.isArray(state.position) && state.position.length === 3) {
        camera.position.set(state.position[0], state.position[1], state.position[2]);
      }
      if (typeof state.fov === 'number') {
        camera.fov = state.fov;
        camera.updateProjectionMatrix();
      }
      if (Array.isArray(state.target) && state.target.length === 3) {
        controls.target.set(state.target[0], state.target[1], state.target[2]);
      }
      controls.update();
      renderer.render(scene, camera);
      return window.__GET_CAMERA_STATE__();
    };

    window.__SET_DETERMINISTIC_TIME__ = function (t) {
      deterministicTime = typeof t === 'number' && !Number.isNaN(t) ? t : null;
      const effectiveT = deterministicTime !== null ? deterministicTime : performance.now() * 0.001;
      updateSceneAtTime(effectiveT);
      renderer.render(scene, camera);
      return deterministicTime;
    };

    window.__SET_HUD_VISIBLE__ = function (visible) {
      document.body.classList.toggle('chromeless', !visible);
      return visible;
    };

    // Populate HUD camera viewpoint buttons
    const cameraLinksContainer = document.getElementById('camera-links');
    Object.entries(CAMERA_PRESETS).forEach(([key, preset]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'camera-link';
      btn.dataset.preset = key;
      btn.textContent = preset.label;
      btn.addEventListener('click', () => {
        window.__SET_CAMERA_PRESET__(key);
      });
      cameraLinksContainer.appendChild(btn);
    });

    // Apply initial preset from URL or default to 'overview'
    const initialPreset = urlParams.get('preset') || 'overview';
    window.__SET_CAMERA_PRESET__(initialPreset);
    if (deterministicTime !== null) {
      window.__SET_DETERMINISTIC_TIME__(deterministicTime);
    }

    // 6-DoF WASD + E/Q Keyboard Navigation
    const pressedKeys = new Set();
    window.addEventListener('keydown', (e) => {
      pressedKeys.add(e.code);
    });
    window.addEventListener('keyup', (e) => {
      pressedKeys.delete(e.code);
    });
    window.addEventListener('blur', () => {
      pressedKeys.clear();
    });

    const moveForward = new THREE.Vector3();
    const moveRight = new THREE.Vector3();
    const moveDelta = new THREE.Vector3();
    const worldUp = new THREE.Vector3(0, 1, 0);

    function applyKeyboardNavigation(dt) {
      if (pressedKeys.size === 0) return;
      const speed = 7.5 * dt;
      moveDelta.set(0, 0, 0);

      camera.getWorldDirection(moveForward);
      moveForward.y = 0;
      if (moveForward.lengthSq() > 1e-6) {
        moveForward.normalize();
      } else {
        moveForward.set(0, 0, -1);
      }
      moveRight.crossVectors(moveForward, worldUp).normalize();

      if (pressedKeys.has('KeyW') || pressedKeys.has('ArrowUp')) {
        moveDelta.addScaledVector(moveForward, speed);
      }
      if (pressedKeys.has('KeyS') || pressedKeys.has('ArrowDown')) {
        moveDelta.addScaledVector(moveForward, -speed);
      }
      if (pressedKeys.has('KeyD') || pressedKeys.has('ArrowRight')) {
        moveDelta.addScaledVector(moveRight, speed);
      }
      if (pressedKeys.has('KeyA') || pressedKeys.has('ArrowLeft')) {
        moveDelta.addScaledVector(moveRight, -speed);
      }
      if (pressedKeys.has('KeyE') || pressedKeys.has('Space')) {
        moveDelta.y += speed;
      }
      if (pressedKeys.has('KeyQ') || pressedKeys.has('ShiftLeft')) {
        moveDelta.y -= speed;
      }

      if (moveDelta.lengthSq() > 0) {
        camera.position.add(moveDelta);
        controls.target.add(moveDelta);
        // Keep camera slightly above water surface
        if (camera.position.y < 0.25) {
          const lift = 0.25 - camera.position.y;
          camera.position.y += lift;
          controls.target.y += lift;
        }
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Main Render Loop
    let lastFrameTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastFrameTime) * 0.001, 0.1);
      lastFrameTime = now;

      applyKeyboardNavigation(dt);
      controls.update();

      const t = deterministicTime !== null ? deterministicTime : now * 0.001;
      updateSceneAtTime(t);

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
